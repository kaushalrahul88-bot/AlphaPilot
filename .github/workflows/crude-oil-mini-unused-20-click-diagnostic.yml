name: Crude Oil Mini Unused 20-Click Diagnostic

on:
  pull_request:
    paths:
      - "app/crude_oil_mini_unused_click_replay.py"
      - ".github/workflows/crude-oil-mini-unused-20-click-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Freeze unused click manifest and run diagnostic
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          import httpx
          from app.crude_oil_mini_unused_click_replay import evaluate_unused_20_clicks

          api=os.environ['API_BASE'].rstrip('/')
          last_error=None
          for attempt in range(1, 9):
              try:
                  with httpx.Client(timeout=420) as client:
                      client.get(f'{api}/health', timeout=30)
                      q=client.get(f'{api}/v1/quote/CRUDEOILM')
                      q.raise_for_status()
                      quote=q.json()
                      c=client.get(f'{api}/v1/candles/CRUDEOILM', params={'timeframe':'5m'})
                      c.raise_for_status()
                      candles=(c.json().get('candles') or [])
                  if candles:
                      break
              except Exception as exc:
                  last_error=exc
                  if attempt == 8:
                      raise
                  time.sleep(15)
          else:
              raise RuntimeError(f'No CRUDEOILM candles returned: {last_error}')

          contract=quote.get('contract') or {}
          result=evaluate_unused_20_clicks(candles, contract)
          Path('crude-oil-mini-unused-20-click-diagnostic.json').write_text(
              json.dumps(result, indent=2, sort_keys=True)+'\n'
          )

          manifest=result['manifest']
          print(json.dumps({
              'reference_contract': result['reference_contract'],
              'manifest_sha256': manifest['manifest_sha256'],
              'frozen_window': manifest['frozen_window'],
              'complete_sessions': manifest['complete_sessions'],
              'previous_click_count': manifest['previous_click_count'],
              'eligible_unused_pool': manifest['eligible_unused_pool'],
              'selected_click_count': manifest['selected_click_count'],
              'overlap_with_previous_clicks': manifest['overlap_with_previous_clicks'],
              'clicks': manifest['clicks'],
              'summary': result['summary'],
              'decisions': result['decisions'],
              'integrity': result['integrity'],
          }, indent=2, sort_keys=True))

          assert result['reference_contract']=='CRUDEOILM21SEP26FUT', result
          assert manifest['complete_sessions']==54, manifest
          assert manifest['previous_click_count']==1080, manifest
          assert manifest['selected_click_count']==20, manifest
          assert manifest['overlap_with_previous_clicks']==0, manifest
          assert result['brain_rules_changed_for_test'] is False, result
          assert result['integrity']['frozen_june_august_window_only'] is True, result
          assert result['integrity']['selection_outcome_blind'] is True, result
          assert result['integrity']['full_remaining_session_path_used'] is True, result
          assert result['integrity']['regular_crude_used'] is False, result
          assert result['integrity']['synthetic_option_prices_used'] is False, result
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-unused-20-click-diagnostic
          path: crude-oil-mini-unused-20-click-diagnostic.json
          if-no-files-found: error
          retention-days: 30
