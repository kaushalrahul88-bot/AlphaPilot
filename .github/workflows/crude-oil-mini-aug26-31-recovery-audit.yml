name: Crude Oil Mini Aug26-31 Recovery Audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/crude-oil-mini-aug26-31-recovery-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependency
        run: python -m pip install httpx
      - name: Pull current CRUDEOILM 5m tape and audit Aug 26-31
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import defaultdict
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import httpx

          IST = ZoneInfo("Asia/Kolkata")
          api = "https://alphapilot-api-pnio.onrender.com"
          with httpx.Client(timeout=180) as client:
              r = client.get(f"{api}/v1/candles/CRUDEOILM", params={"timeframe":"5m"})
              r.raise_for_status()
              body = r.json()

          rows = body.get("candles") or []
          by_day = defaultdict(list)
          for row in rows:
              raw = str(row[0])
              stamp = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              if stamp.tzinfo is None:
                  stamp = stamp.replace(tzinfo=IST)
              stamp = stamp.astimezone(IST)
              by_day[stamp.date().isoformat()].append((stamp, row))

          targets = ["2026-08-26","2026-08-27","2026-08-28","2026-08-29","2026-08-30","2026-08-31"]
          report_days = []
          for day in targets:
              rr = sorted(by_day.get(day, []), key=lambda x:x[0])
              if not rr:
                  report_days.append({"date":day,"status":"NO_DATA","candles":0,"complete_for_20_click_research":False})
                  continue
              first, last = rr[0][0], rr[-1][0]
              complete = len(rr) >= 140 and last.hour >= 21
              report_days.append({
                  "date":day,
                  "status":"COMPLETE" if complete else "PARTIAL",
                  "candles":len(rr),
                  "first_at":first.isoformat(),
                  "last_at":last.isoformat(),
                  "complete_for_20_click_research":complete,
              })

          complete_all = []
          for day, rr in sorted(by_day.items()):
              rr = sorted(rr,key=lambda x:x[0])
              if rr and len(rr)>=140 and rr[-1][0].hour>=21:
                  complete_all.append(day)

          result = {
              "mode":"CRUDE_OIL_MINI_AUG26_31_RECOVERY_AUDIT_V1",
              "underlying_symbol":"CRUDEOILM",
              "expected_reference_contract":"CRUDEOILM21SEP26FUT",
              "rows_returned":len(rows),
              "first_at":str(rows[0][0]) if rows else None,
              "last_at":str(rows[-1][0]) if rows else None,
              "target_days":report_days,
              "complete_sessions_total":len(complete_all),
              "complete_session_first":complete_all[0] if complete_all else None,
              "complete_session_last":complete_all[-1] if complete_all else None,
              "eligible_backtest_sessions_through_aug31":[d for d in complete_all if d <= "2026-08-31"],
              "sep1_excluded_as_in_progress":True,
          }
          Path("crude-oil-mini-aug26-31-recovery-audit.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-aug26-31-recovery-audit
          path: crude-oil-mini-aug26-31-recovery-audit.json
          if-no-files-found: warn
          retention-days: 30
