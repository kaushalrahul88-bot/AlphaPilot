name: Crude Oil Mini August Old vs Integrated V2

on:
  push:
    branches:
      - crude-august-old-vs-integrated-v2-diagnostic-v1
    paths:
      - app/crude_oil_mini_august_old_vs_integrated_v2_diagnostic.py
      - .github/workflows/crude-oil-mini-august-old-vs-integrated-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      BASELINE_ARTIFACT_ID: "9876280660"
      EXPECTED_MANIFEST_SHA256: c1e813f9748b746b7f0e90e0558ed33df1afe1b579dee23e3c3193f46b934349
      EVENT_ARCHIVE_COMMIT: 3f55c02096b7d30d424b9cf1018774d54fe69ce7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Download exact frozen PR 318 baseline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip" \
            -o frozen-baseline.zip
          unzip -q frozen-baseline.zip -d frozen-baseline
          test -f frozen-baseline/crude-oil-mini-august-20-new-clicks.json

      - name: Download immutable August PIT event archive
        run: |
          set -euo pipefail
          mkdir -p frozen-events
          for part in \
            crude_aug_2026_pit_events_01_07.json \
            crude_aug_2026_pit_events_08_14.json \
            crude_aug_2026_pit_events_15_21.json \
            crude_aug_2026_pit_events_22_30.json
          do
            curl --fail --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${EVENT_ARCHIVE_COMMIT}/research/${part}" \
              -o "frozen-events/${part}"
          done
          sha256sum frozen-events/*.json

      - name: Run approved descriptive comparison
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          import httpx

          from app.crude_oil_mini_august_old_vs_integrated_v2_diagnostic import compare_old_vs_integrated_v2
          from app.crude_oil_pit_context_probe import probe_crude_oil_pit_context_sync

          api = os.environ["API_BASE"].rstrip("/")
          candles = []
          last_error = None
          for attempt in range(1, 13):
              try:
                  with httpx.Client(timeout=420) as client:
                      try:
                          client.get(f"{api}/health", timeout=30)
                      except Exception:
                          pass
                      response = client.get(
                          f"{api}/v1/candles/CRUDEOILM",
                          params={"timeframe": "5m"},
                      )
                      response.raise_for_status()
                      candles = response.json().get("candles") or []
                  if candles:
                      break
                  raise RuntimeError("empty CRUDEOILM candle response")
              except Exception as exc:
                  last_error = exc
                  if attempt == 12:
                      raise
                  time.sleep(20)
          if not candles:
              raise RuntimeError(f"No CRUDEOILM candles returned: {last_error}")

          baseline = json.loads(
              Path("frozen-baseline/crude-oil-mini-august-20-new-clicks.json").read_text(encoding="utf-8")
          )
          context = probe_crude_oil_pit_context_sync(
              "2026-06-01T00:00:00+05:30",
              "2026-09-01T00:00:00+05:30",
          )
          result = compare_old_vs_integrated_v2(
              candles=candles,
              frozen_baseline=baseline,
              context_probe=context,
              event_dir="frozen-events",
          )

          output = Path("crude-oil-mini-august-old-vs-integrated-v2.json")
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          compact = {key: value for key, value in result.items() if key != "enriched_clicks"}
          print(json.dumps(compact, indent=2, sort_keys=True))

          assert result["manifest_sha256"] == os.environ["EXPECTED_MANIFEST_SHA256"]
          assert result["baseline"]["clicks"] == 420
          assert result["baseline"]["trades"] == 119
          assert result["baseline"]["buy_pe"] == 38
          assert float(result["baseline"]["net_r"]) == -10.0
          assert result["old_v2"]["direction_counts"] == {"BEARISH": 67, "BULLISH": 122, "UNKNOWN": 231}
          assert result["old_v2"]["confidence_counts"] == {"CONFLICTED": 115, "MODERATE": 121, "STRONG": 68, "WEAK": 116}
          assert result["event_lifecycle"]["archive_commit"] == os.environ["EVENT_ARCHIVE_COMMIT"]
          assert result["event_lifecycle"]["archive_record_count"] == 26
          integrity = result["integrity"]
          assert integrity["same_frozen_420_click_manifest"] is True
          assert integrity["same_frozen_current_mind"] is True
          assert integrity["same_frozen_trade_outcomes"] is True
          assert integrity["threshold_search_performed"] is False
          assert integrity["optimization_performed"] is False
          assert integrity["candidate_filter_selected"] is False
          assert integrity["new_geometry_generated"] is False
          assert integrity["option_pnl_evaluated"] is False
          assert integrity["fixed_horizon_direction_scoring_added"] is False
          assert integrity["retroactive_oi_reconstruction_used"] is False
          assert integrity["headline_sentiment_used"] is False
          assert integrity["event_reaction_backfilled"] is False
          assert integrity["current_mind_mutated"] is False
          assert integrity["click_schedule_changed"] is False
          assert integrity["promotion_allowed"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: crude-oil-mini-august-old-vs-integrated-v2
          path: crude-oil-mini-august-old-vs-integrated-v2.json
          retention-days: 30
