name: Copper News Thesis Interaction Shadow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/copper-news-thesis-interaction-shadow.yml"
      - "app/market_news_thesis_interaction.py"
      - "app/playbook_pattern_confirmation_shadow.py"
      - "app/market_news_catalyst_control.py"
      - "app/current_mind_copper_replay.py"
      - "app/current_mind_thesis_builder.py"
      - "app/setup_playbook_selector.py"
      - "scripts/audit_market_news_reactions.py"
      - "scripts/audit_market_news_thesis_interaction.py"
      - "scripts/audit_playbook_pattern_gate_shadow.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: copper-news-thesis-interaction-shadow
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPANDED_NEWS_RUN_ID: "33357324842"
      EXPANDED_NEWS_ARTIFACT: "copper-current-mind-expanded-68-news-replay"
      FROZEN_CANDLES_RUN_ID: "33405492674"
      FROZEN_CANDLES_ARTIFACT: "copper-frozen-reaction-candles"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download frozen audit inputs
        run: |
          set -euo pipefail
          mkdir -p news-source frozen-candles
          gh run download "$EXPANDED_NEWS_RUN_ID" --name "$EXPANDED_NEWS_ARTIFACT" --dir news-source
          gh run download "$FROZEN_CANDLES_RUN_ID" --name "$FROZEN_CANDLES_ARTIFACT" --dir frozen-candles
          test -f news-source/expanded-news-payload.json
          test -f frozen-candles/copper-frozen-reaction-candles.json

      - name: Run outcome-blind thesis interaction shadow
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/audit_market_news_thesis_interaction.py \
            --news news-source/expanded-news-payload.json \
            --candles frozen-candles/copper-frozen-reaction-candles.json \
            --output copper-news-thesis-interaction-shadow.json

      - name: Verify thesis and pattern invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("copper-news-thesis-interaction-shadow.json").read_text())
          assert report["mode"]=="COPPER_NEWS_CATALYST_THESIS_INTERACTION_SHADOW_V2",report
          assert report["research_only"] is True,report
          assert report["descriptive_only"] is True,report
          assert report["production_rules_changed"] is False,report
          assert report["strategy_rules_changed"] is False,report
          assert report["validation_status"]=="DIAGNOSTIC_REPLAY_NOT_UNTOUCHED_HOLDOUT",report
          shadow=report["shadow_policy"]
          assert shadow["outcome_blind"] is True,shadow
          assert shadow["shadow_only"] is True,shadow
          assert shadow["changes_decision"] is False,shadow
          assert shadow["headline_stance_used_for_direction"] is False,shadow
          assert shadow["literal_playbook_pattern_confirmation_added"] is True,shadow
          assert shadow["pattern_confirmation_reads_only_bars_at_or_before_click"] is True,shadow
          assert shadow["pattern_lookback_bars"]==6,shadow
          assert shadow["pattern_lookback_source"]=="FROZEN_CURRENT_MIND_INVALIDATION_WINDOW",shadow
          assert shadow["pattern_specific_confirmation_required_for_semantic_verification"] is True,shadow
          assert shadow["generic_regime_eligibility_is_not_pattern_confirmation"] is True,shadow
          assert shadow["generic_recent_high_low_trigger_is_not_pattern_confirmation"] is True,shadow
          assert shadow["thresholds_fitted_to_august_outcomes"] is False,shadow
          integrity=report["outcome_integrity"]
          assert integrity["outcomes_read_for_thesis_interaction_shadow"] is False,integrity
          assert integrity["outcomes_read_for_pattern_confirmation_shadow"] is False,integrity
          assert integrity["outcomes_read_after_both_shadows_freeze_for_descriptive_evaluation"] is True,integrity
          source=report["sources"]
          assert source["frozen_candles"]["trading_symbol"]=="COPPER31AUG26FUT",source
          assert source["frozen_candles"]["network_refetch"] is False,source
          assert source["frozen_candles"]["point_in_time"] is True,source
          assert source["frozen_candles"]["normalized_rows"]==3318,source
          assert source["baseline_replay"]["scheduled_clicks"]==360,source
          assert source["baseline_replay"]["evaluated_clicks"]==360,source
          assert source["baseline_replay"]["click_coverage_exact"] is True,source
          assert source["reaction_audit"]["events"]==8,source
          assert source["reaction_audit"]["classified"]==7,source
          assert report["clicks"]==360,report
          assert len(report["rows"])==360,report
          assert sum(report["catalyst_control_counts"].values())==360,report
          assert sum(report["thesis_interaction_counts"].values())==360,report
          assert sum(report["declared_playbook_counts"].values())==360,report
          assert sum(report["playbook_semantic_status_counts"].values())==360,report
          assert sum(report["pattern_confirmation_status_counts"].values())==360,report
          assert sum(report["active_opposing_catalyst_playbook_counts"].values())==len(report["active_opposing_rows"]),report
          for row in report["rows"]:
              interaction=row["news_thesis_interaction_shadow"]
              pattern=row["playbook_pattern_confirmation_shadow"]
              assert interaction["outcome_blind"] is True,interaction
              assert interaction["shadow_only"] is True,interaction
              assert interaction["changes_decision"] is False,interaction
              assert pattern["outcome_blind"] is True,pattern
              assert pattern["shadow_only"] is True,pattern
              assert pattern["changes_decision"] is False,pattern
          PY

      - name: Run playbook pattern gate shadow
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/audit_playbook_pattern_gate_shadow.py \
            --thesis-report copper-news-thesis-interaction-shadow.json \
            --output copper-playbook-pattern-gate-shadow.json

      - name: Verify pattern gate invariants and summarize
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          thesis=json.loads(Path("copper-news-thesis-interaction-shadow.json").read_text())
          gate=json.loads(Path("copper-playbook-pattern-gate-shadow.json").read_text())
          assert gate["mode"]=="COPPER_PLAYBOOK_PATTERN_GATE_SHADOW_V1",gate
          assert gate["research_only"] is True,gate
          assert gate["descriptive_only"] is True,gate
          assert gate["shadow_only"] is True,gate
          assert gate["production_rules_changed"] is False,gate
          assert gate["strategy_rules_changed"] is False,gate
          assert gate["validation_status"]=="POST_HOC_DIAGNOSTIC_REQUIRES_UNTOUCHED_FORWARD_TEST",gate
          policy=gate["candidate_policy"]
          assert policy["can_create_trade"] is False,policy
          assert policy["can_reverse_direction"] is False,policy
          assert policy["can_upgrade_abstention"] is False,policy
          assert policy["unconfirmed_action_effect"]=="DELAY_EXISTING_ACTION_TO_WAIT",policy
          assert policy["pattern_definition_changed_after_august_outcomes_seen"] is False,policy
          assert policy["gate_formalized_after_august_pattern_outcomes_seen"] is True,policy
          assert policy["promotion_from_august_result_allowed"] is False,policy
          assert policy["untouched_forward_validation_required"] is True,policy
          integrity=gate["outcome_integrity"]
          assert integrity["outcomes_read_for_gate_action"] is False,integrity
          assert integrity["outcomes_read_after_gate_action_freeze_for_evaluation"] is True,integrity
          assert gate["clicks"]==360,gate
          assert len(gate["rows"])==360,gate
          assert gate["baseline"]["trades"]==171,gate
          assert gate["baseline"]["resolved_trades"]==135,gate
          assert gate["pattern_gate"]["trades"]==thesis["pattern_confirmation_status_counts"].get("PATTERN_CONFIRMED",0),gate
          assert gate["changed_clicks"]==gate["baseline"]["trades"]-gate["pattern_gate"]["trades"],gate
          for row in gate["rows"]:
              if row["baseline_action"] in {"BUY_CE","BUY_PE"}:
                  if row["pattern_confirmed"]:
                      assert row["pattern_gate_action"]==row["baseline_action"],row
                  else:
                      assert row["pattern_gate_action"]=="WAIT",row
              else:
                  assert row["pattern_gate_action"]==row["baseline_action"],row

          print("PLAYBOOK_PATTERN_GATE_SHADOW_SUMMARY")
          print(json.dumps({
              "baseline":gate["baseline"],
              "pattern_gate":gate["pattern_gate"],
              "delta":gate["delta"],
              "changed_clicks":gate["changed_clicks"],
              "suppressed_baseline_outcomes":gate["suppressed_baseline_outcomes"],
              "suppressed_playbooks":gate["suppressed_playbooks"],
              "validation_status":gate["validation_status"],
          },indent=2,sort_keys=True))
          print("ACTIVE_OPPOSING_ROWS")
          for row in thesis["active_opposing_rows"]:
              print(json.dumps({
                  "click_timestamp":row["click_timestamp"],
                  "baseline_action":row["baseline_action"],
                  "declared_playbook":row["declared_playbook"],
                  "literal_pattern_status":row["playbook_pattern_confirmation_shadow"]["status"],
                  "literal_pattern_detail":row["playbook_pattern_confirmation_shadow"].get("detail"),
                  "catalyst_direction":row["catalyst_control_shadow"].get("direction"),
                  "catalyst_control_state":row["catalyst_control_shadow"].get("state"),
                  "baseline_result_post_freeze":(row.get("baseline_outcome") or {}).get("result"),
              },sort_keys=True))
          PY

      - name: Write reproducibility manifest
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path("copper-news-thesis-interaction-shadow.json").read_text())
          gate=json.loads(Path("copper-playbook-pattern-gate-shadow.json").read_text())
          manifest={
              "mode":"COPPER_NEWS_CATALYST_THESIS_INTERACTION_SHADOW_MANIFEST_V3",
              "expanded_news":{"run_id":os.environ["EXPANDED_NEWS_RUN_ID"],"artifact":os.environ["EXPANDED_NEWS_ARTIFACT"]},
              "frozen_candles":{"run_id":os.environ["FROZEN_CANDLES_RUN_ID"],"artifact":os.environ["FROZEN_CANDLES_ARTIFACT"]},
              "network_refetch":False,
              "outcome_blind_thesis_interaction_state":True,
              "outcome_blind_playbook_pattern_state":True,
              "outcome_blind_pattern_gate_action":True,
              "outcomes_used_only_after_shadow_freeze":True,
              "production_rules_changed":False,
              "strategy_rules_changed":False,
              "thesis_validation_status":report["validation_status"],
              "pattern_gate_validation_status":gate["validation_status"],
              "pattern_gate_promotion_from_august_allowed":False,
              "rule":"Audit catalyst/thesis interaction, literal declared-playbook confirmation, and a post-hoc shadow gate that only delays unconfirmed named-playbook actions. August performance cannot promote the gate; untouched forward validation is required.",
          }
          Path("copper-news-thesis-interaction-shadow-manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: copper-news-thesis-interaction-shadow
          path: |
            copper-news-thesis-interaction-shadow.json
            copper-playbook-pattern-gate-shadow.json
            copper-news-thesis-interaction-shadow-manifest.json
          if-no-files-found: error
          retention-days: 30
