name: Copper Current Mind Historical News Replay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/copper_historical_news.py"
      - "app/current_mind_copper_replay.py"
      - "app/main.py"
      - ".github/workflows/copper-current-mind-historical-news-replay.yml"
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      COLLECTOR_TOKEN: ${{ secrets.COMMODITY_COLLECTOR_TOKEN }}
    steps:
      - name: Wait for exact Render commit
        run: |
          set -euo pipefail; test -n "$COLLECTOR_TOKEN"
          for i in {1..75}; do
            if curl -fsS --max-time 20 "$API_BASE/health" -o h.json; then D=$(python -c 'import json;print(json.load(open("h.json")).get("deployment_commit") or "")'); if [ "$D" = "$GITHUB_SHA" ]; then exit 0; fi; fi; sleep 10; done; exit 1
      - name: Start news replay
        run: |
          curl -fsS --max-time 30 -X POST -H "X-Collector-Token: $COLLECTOR_TOKEN" "$API_BASE/v1/internal/copper/current-mind-news-replay/start"
      - name: Wait and capture result
        run: |
          set -euo pipefail
          for i in {1..80}; do
            curl -fsS --max-time 30 -H "X-Collector-Token: $COLLECTOR_TOKEN" "$API_BASE/v1/internal/copper/current-mind-news-replay/status" -o state.json
            S=$(python -c 'import json;print(json.load(open("state.json")).get("status"))'); echo "Replay state: $S"
            if [ "$S" = "COMPLETED" ]; then python -c 'import json;d=json.load(open("state.json"));json.dump(d["result"],open("result.json","w"),indent=2)'; break; fi
            if [ "$S" = "FAILED" ]; then cat state.json; exit 1; fi; sleep 15
          done
          test -s result.json
          python - <<'PY'
          import json
          d=json.load(open("result.json"));assert d["scheduled_clicks"]==360 and d["evaluated_clicks"]==360 and d["click_coverage_exact"]
          assert d["data_context"]["historical_news"] is True
          assert (d.get("news_metadata") or {}).get("record_count",0)>0
          print(json.dumps({k:d.get(k) for k in ("reference_contract","scheduled_clicks","evaluated_clicks","actions","targets","stops","no_entry","session_end","expectancy_r_resolved","missed_large_moves_after_abstention","news_metadata")},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copper-current-mind-historical-news-replay
          path: result.json
