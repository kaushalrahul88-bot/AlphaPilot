name: F&O Candle-Only Four-Stock 20-Day Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fno-candle-only-four-stock-20d-backtest.yml"
      - "app/fno_candle_only_four_stock_backtest_v1.py"
      - "app/fno_candle_only_four_stock_backtest_api.py"
      - "app/__init__.py"

permissions:
  contents: read

concurrency:
  group: fno-candle-only-four-stock-20d-backtest
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      COLLECTOR_TOKEN: ${{ secrets.COMMODITY_COLLECTOR_TOKEN }}
    steps:
      - name: Wait for deployed endpoint
        run: |
          set -euo pipefail
          test -n "$COLLECTOR_TOKEN"
          for i in {1..120}; do
            if curl -fsS --max-time 20 "$API_BASE/health" -o health.json; then
              DEPLOYED=$(python -c 'import json;print(json.load(open("health.json")).get("deployment_commit") or "")')
              echo "Render commit: $DEPLOYED; expected: $GITHUB_SHA"
              if [ "$DEPLOYED" = "$GITHUB_SHA" ]; then
                if curl -fsS --max-time 20 "$API_BASE/openapi.json" -o openapi.json && python -c 'import json,sys; p=json.load(open("openapi.json")).get("paths",{}); sys.exit(0 if "/v1/internal/fno/candle-only-four-stock-backtest/start" in p else 1)'; then
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for Render deployment"
          exit 1

      - name: Start replay
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H "X-Collector-Token: $COLLECTOR_TOKEN" -X POST "$API_BASE/v1/internal/fno/candle-only-four-stock-backtest/start" -o start.json
          cat start.json
          python - <<'PY'
          import json
          d=json.load(open("start.json"))
          assert d.get("status") in {"RUNNING","COMPLETED"}, d
          assert d.get("candle_only") is True, d
          assert d.get("option_data_required") is False, d
          assert d.get("live_execution") is False, d
          assert d.get("capital_committed") == 0, d
          PY

      - name: Poll replay
        run: |
          set -euo pipefail
          : > status.json
          for i in {1..240}; do
            if curl -fsS --max-time 30 -H "X-Collector-Token: $COLLECTOR_TOKEN" "$API_BASE/v1/internal/fno/candle-only-four-stock-backtest/status" -o status.json; then
              STATE=$(python -c 'import json;print(json.load(open("status.json")).get("status","UNKNOWN"))')
              python -c 'import json;d=json.load(open("status.json"));print("state:",d.get("status"),"attempt:",d.get("attempt_count"))'
              if [ "$STATE" = "COMPLETED" ]; then break; fi
              if [ "$STATE" = "FAILED" ]; then cat status.json; exit 1; fi
            else
              echo "Transient status request failure; retrying durable run"
            fi
            sleep 15
          done
          test -s status.json
          test "$(python -c 'import json;print(json.load(open("status.json")).get("status",""))')" = "COMPLETED"

      - name: Fetch and validate result
        run: |
          set -euo pipefail
          curl -fsS --max-time 180 -H "X-Collector-Token: $COLLECTOR_TOKEN" "$API_BASE/v1/internal/fno/candle-only-four-stock-backtest/result" -o result.json
          python - <<'PY'
          import json
          d=json.load(open("result.json")); e=d["experiment"]
          assert d["status"]=="COMPLETED", d.get("status")
          assert e["session_count"]==20 and e["clicks_per_day"]==20, e
          assert e["expected_observations"]==1600 and e["observations"]==1600, e
          s=d["safety"]
          assert s["candle_only"] is True and s["option_data_required"] is False
          for key in ("option_chain_read","option_premium_read","option_oi_read","iv_read","greeks_read","futures_read","news_read","live_execution"):
              assert s[key] is False, (key,s)
          summary={k:d[k] for k in ("experiment","data_coverage","brain_input_audit","summary","by_stock","methodology","safety")}
          json.dump(summary,open("summary.json","w"),indent=2,sort_keys=True)
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fno-candle-only-four-stock-20d-backtest
          path: |
            result.json
            summary.json
