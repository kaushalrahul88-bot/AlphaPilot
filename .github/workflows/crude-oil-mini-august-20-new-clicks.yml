name: Crude Oil Mini August 20 New Clicks Per Day

on:
  pull_request:
    paths:
      - "app/crude_oil_mini_august_20_click_backtest.py"
      - ".github/workflows/crude-oil-mini-august-20-new-clicks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  august-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Run frozen August backtest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          import httpx
          from app.crude_oil_mini_august_20_click_backtest import evaluate_august_20_new_clicks_per_day

          api = os.environ['API_BASE'].rstrip('/')
          last_error = None
          for attempt in range(1, 9):
              try:
                  with httpx.Client(timeout=420) as client:
                      health = client.get(f'{api}/health', timeout=30)
                      health.raise_for_status()
                      q = client.get(f'{api}/v1/quote/CRUDEOILM')
                      q.raise_for_status()
                      quote = q.json()
                      c = client.get(f'{api}/v1/candles/CRUDEOILM', params={'timeframe':'5m'})
                      c.raise_for_status()
                      candles = c.json().get('candles') or []
                  if candles:
                      break
              except Exception as exc:
                  last_error = exc
                  if attempt == 8:
                      raise
                  time.sleep(15)
          else:
              raise RuntimeError(f'No CRUDEOILM candles returned: {last_error}')

          contract = quote.get('contract') or {}
          result = evaluate_august_20_new_clicks_per_day(candles, contract)
          Path('crude-oil-mini-august-20-new-clicks.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )

          manifest = result['manifest']
          compact = {
              'reference_contract': result['reference_contract'],
              'direction_audit_included': result['direction_audit_included'],
              'rupee_pnl_available': result['rupee_pnl_available'],
              'manifest': {k: v for k, v in manifest.items() if k != 'clicks'},
              'daily': result['daily'],
              'monthly': result['monthly'],
              'integrity': result['integrity'],
          }
          print(json.dumps(compact, indent=2, sort_keys=True))

          assert result['reference_contract'] == 'CRUDEOILM21SEP26FUT', result['reference_contract']
          assert manifest['complete_sessions_june_august'] == 54, manifest
          assert manifest['previous_original_click_count'] == 1080, manifest
          assert manifest['previous_extra_august_click_count'] == 8, manifest
          assert manifest['august_trading_sessions'] > 0, manifest
          assert manifest['selected_click_count'] == manifest['august_trading_sessions'] * 20, manifest
          assert manifest['overlap_with_original_1080'] == 0, manifest
          assert manifest['overlap_with_extra_diagnostic'] == 0, manifest
          assert all(row['clicks'] == 20 for row in result['daily'].values()), result['daily']
          assert result['brain_rules_changed_for_test'] is False, result
          assert result['direction_audit_included'] is False, result
          assert result['integrity']['fixed_horizon_direction_scoring_used'] is False, result
          assert result['integrity']['full_remaining_session_path_used'] is True, result
          assert result['integrity']['regular_crude_used'] is False, result
          assert result['integrity']['synthetic_option_prices_used'] is False, result
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-august-20-new-clicks
          path: crude-oil-mini-august-20-new-clicks.json
          if-no-files-found: error
          retention-days: 30
