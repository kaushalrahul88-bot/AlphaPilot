name: Copper Stored Stability After Perf Fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/copper-stored-stability-after-perf.yml"

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - name: Wait for optimized backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 20 "$API_BASE/openapi.json" -o openapi.json; then
              if python -c 'import json,sys; d=json.load(open("openapi.json")); sys.exit(0 if "/v1/research/copper/regime-stability-stored-v1" in (d.get("paths") or {}) else 1)'; then
                exit 0
              fi
            fi
            sleep 10
          done
          exit 1

      - name: Run stored Copper stability
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          curl --fail --silent --show-error --max-time 180             -H 'Content-Type: application/json'             -X POST "$API_BASE/v1/research/copper/regime-stability-stored-v1"             -d '{"days":45,"sample_every_bars":3,"round_trip_cost_bps":4.0}'             -o copper-stored-stability.json
          finished=$(date +%s)
          echo "elapsed_seconds=$((finished-started))"
          python - <<'PY'
          import json
          d=json.load(open("copper-stored-stability.json"))
          assert d.get("mode")=="ALPHAPILOT_COPPER_REGIME_STABILITY_STORED_V1", d
          s=d["study"]
          print(json.dumps({
            "coverage": d["coverage"],
            "windows": s["windows"],
            "window_sizes": s["window_sizes"],
            "recurring_positive_candidates": s["recurring_positive_candidates"],
          }, indent=2))
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copper-stored-stability-after-perf
          path: copper-stored-stability.json
          if-no-files-found: warn
