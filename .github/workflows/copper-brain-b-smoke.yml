name: Copper Brain B Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/copper-brain-b-smoke.yml"

permissions:
  contents: read

jobs:
  brain-b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - name: Wait for Brain B route
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 20 "$API_BASE/openapi.json" -o openapi.json; then
              if python -c 'import json,sys; d=json.load(open("openapi.json")); sys.exit(0 if "/v1/research/copper/brain-b-v1" in (d.get("paths") or {}) else 1)'; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Brain B route did not deploy" >&2
          exit 1

      - name: Run Experiment 002
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 240             -H 'Content-Type: application/json'             -X POST "$API_BASE/v1/research/copper/brain-b-v1"             -d '{"days":14,"sample_every_bars":3,"round_trip_cost_bps":4.0}'             -o copper-brain-b.json
          python - <<'PY'
          import json
          d=json.load(open("copper-brain-b.json"))
          assert d.get("mode")=="ALPHAPILOT_COPPER_EXPERIMENT_002", d
          c=d["comparison"]
          print(json.dumps({
            "split": c["split"],
            "train": {
              "brain_a": {k:c["train"]["brain_a"].get(k) for k in ["signals","win_rate_pct","avg_net_return_pct","profit_factor"]},
              "brain_b": {k:c["train"]["brain_b"].get(k) for k in ["signals","win_rate_pct","avg_net_return_pct","profit_factor"]},
            },
            "holdout": {
              "brain_a": {k:c["holdout"]["brain_a"].get(k) for k in ["signals","win_rate_pct","avg_net_return_pct","profit_factor"]},
              "brain_b": {k:c["holdout"]["brain_b"].get(k) for k in ["signals","win_rate_pct","avg_net_return_pct","profit_factor"]},
            },
            "gate": c["gate"],
          }, indent=2))
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copper-experiment-002
          path: copper-brain-b.json
          if-no-files-found: warn
