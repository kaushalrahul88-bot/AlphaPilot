name: Copper Context Coverage Audit
on:
  push:
    branches: [main]
    paths:
      - "app/copper_context_ablation.py"
      - "app/main.py"
      - ".github/workflows/copper-context-coverage-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - name: Wait for deployed route and run audit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            code=$(curl --silent --output result.json --write-out "%{http_code}" --max-time 120               -H 'Content-Type: application/json'               -X POST "$API_BASE/v1/research/copper/expanding-daily-edge-context-audit-v1"               -d '{"days":3650,"sample_every_bars":3,"round_trip_cost_bps":4.0}' || true)
            if [ "$code" = "200" ]; then
              python -m json.tool result.json
              exit 0
            fi
            sleep 10
          done
          cat result.json || true
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copper-context-coverage-audit-v1
          path: result.json
          if-no-files-found: warn
