name: Crude Oil Mini August V2 Redesign Comparison

on:
  workflow_dispatch:
  push:
    branches:
      - crude-direction-v2-evidence-independence-v1
    paths:
      - app/crude_oil_mini_august_v2_redesign_comparison.py
      - app/crude_oil_mini_direction_brain_v2_legacy_snapshot.py
      - app/crude_oil_mini_direction_brain_v2.py
      - app/crude_oil_mini_participation_v2.py
      - app/crude_oil_mini_evidence_dependency.py
      - app/crude_oil_mini_event_reaction_v2.py
      - app/crude_oil_mini_event_archive.py
      - research/crude_aug_2026_pit_event_archive_v2_manifest.json
      - research/crude_aug_2026_pit_events_01_07.json
      - research/crude_aug_2026_pit_events_08_14.json
      - research/crude_aug_2026_pit_events_15_21.json
      - research/crude_aug_2026_pit_events_22_30.json
      - .github/workflows/crude-oil-mini-august-v2-redesign-comparison.yml

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      BASELINE_ARTIFACT_ID: "9876280660"
      EXPECTED_MANIFEST_SHA256: c1e813f9748b746b7f0e90e0558ed33df1afe1b579dee23e3c3193f46b934349
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Download exact frozen PR 318 baseline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip" \
            -o frozen-baseline.zip
          unzip -q frozen-baseline.zip -d frozen-baseline
          test -f frozen-baseline/crude-oil-mini-august-20-new-clicks.json

      - name: Compare old and redesigned shadow V2
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          import httpx

          from app.crude_oil_mini_august_v2_redesign_comparison import compare_old_and_redesigned_v2
          from app.crude_oil_pit_context_probe import probe_crude_oil_pit_context_sync

          api = os.environ["API_BASE"].rstrip("/")
          candles = []
          last_error = None
          for attempt in range(1, 13):
              try:
                  with httpx.Client(timeout=420) as client:
                      try:
                          client.get(f"{api}/health", timeout=30)
                      except Exception:
                          pass
                      response = client.get(f"{api}/v1/candles/CRUDEOILM", params={"timeframe": "5m"})
                      response.raise_for_status()
                      candles = response.json().get("candles") or []
                  if candles:
                      break
                  raise RuntimeError("empty CRUDEOILM candle response")
              except Exception as exc:
                  last_error = exc
                  if attempt == 12:
                      raise
                  time.sleep(20)
          if not candles:
              raise RuntimeError(f"No CRUDEOILM candles returned: {last_error}")

          baseline = json.loads(Path("frozen-baseline/crude-oil-mini-august-20-new-clicks.json").read_text())
          context = probe_crude_oil_pit_context_sync(
              "2026-06-01T00:00:00+05:30",
              "2026-09-01T00:00:00+05:30",
          )
          result = compare_old_and_redesigned_v2(
              candles=candles,
              frozen_baseline=baseline,
              context_probe=context,
              repo_root=".",
          )
          Path("crude-oil-mini-august-v2-redesign-comparison.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          compact = {k: v for k, v in result.items() if k != "enriched_clicks"}
          print(json.dumps(compact, indent=2, sort_keys=True))

          assert result["manifest_sha256"] == os.environ["EXPECTED_MANIFEST_SHA256"]
          assert result["baseline"]["clicks"] == 420
          assert float(result["baseline"]["net_r"]) == -10.0
          assert result["old_v2"]["direction_counts"] == {"BEARISH": 67, "BULLISH": 122, "UNKNOWN": 231}
          assert result["threshold_search_performed"] is False
          assert result["candidate_filter_selected"] is False
          assert result["current_mind_mutated"] is False
          assert result["click_schedule_changed"] is False
          assert result["future_direction_scoring_used"] is False
          assert result["geometry_generated_by_v2"] is False
          assert result["option_pnl_used_by_v2"] is False
          assert result["event_reaction_backfilled"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: crude-oil-mini-august-v2-redesign-comparison
          path: crude-oil-mini-august-v2-redesign-comparison.json
          retention-days: 30
