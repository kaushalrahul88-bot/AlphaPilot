name: Crude Oil Mini Provider Parity Gate

on:
  pull_request:
    paths:
      - ".github/workflows/crude-oil-mini-current-contract-data-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      EXPECTED_DEPLOYMENT: 5db308165a4fd3aea5e9e2359254dc188750c98a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify Mini integrity helpers
        run: python -m unittest tests.test_crude_oil_mini_data_probe tests.test_groww_crude_oil_mini_provider tests.test_groww_crude_oil_mini_history_fallback -v

      - name: Wait for exact Mini history-fallback deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            CODE=$(curl --silent --show-error --max-time 30 -o health.json -w "%{http_code}" "$API_BASE/health" || true)
            if [ "$CODE" = "200" ]; then
              DEPLOYED=$(python - <<'PY'
          import json
          try:
              print(json.load(open('health.json')).get('deployment_commit') or '')
          except Exception:
              print('')
          PY
          )
              echo "attempt=$attempt deployed=$DEPLOYED expected=$EXPECTED_DEPLOYMENT"
              if [ "$DEPLOYED" = "$EXPECTED_DEPLOYMENT" ]; then
                cat health.json
                exit 0
              fi
            fi
            sleep 10
          done
          cat health.json 2>/dev/null || true
          exit 1

      - name: Verify live Mini quote, futures history and Mini option premiums
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, json, os
          from datetime import date
          from pathlib import Path
          import httpx

          from app.crude_oil_mini_contracts import (
              CRUDE_OIL_MINI,
              fetch_crude_oil_mini_master,
              resolve_crude_oil_mini_universe,
          )
          from app.crude_oil_mini_data_probe import _complete_sessions, _nearest_option

          api=os.environ['API_BASE'].rstrip('/')

          def get_json(path, params=None, timeout=240):
              with httpx.Client(timeout=timeout) as client:
                  r=client.get(f"{api}{path}", params=params)
                  r.raise_for_status()
                  return r.json()

          quote=get_json('/v1/quote/CRUDEOILM', timeout=60)
          qcontract=quote.get('contract') or {}
          qpayload=((quote.get('data') or {}).get('payload') or {})
          last_price=float(qpayload.get('last_price') or 0)

          future_body=get_json('/v1/candles/CRUDEOILM', {'timeframe':'5m'})
          future_rows=future_body.get('candles') or []
          sessions=_complete_sessions(future_rows)
          complete=[s for s in sessions if s.get('complete_for_20_click_research')]

          master=asyncio.run(fetch_crude_oil_mini_master())
          universe=resolve_crude_oil_mini_universe(master, date.today())
          expiry=universe['nearest_option_expiry']
          option_probes=[]
          for option_type in ('CE','PE'):
              contract=_nearest_option(master, expiry=expiry, option_type=option_type, price=last_price)
              if contract is None:
                  option_probes.append({'option_type':option_type,'status':'CONTRACT_NOT_FOUND'})
                  continue
              body=get_json(f"/v1/candles/{contract['trading_symbol']}", {'timeframe':'5m'})
              rows=body.get('candles') or []
              option_probes.append({
                  'option_type':option_type,
                  'status':'AVAILABLE' if rows else 'NO_CANDLES',
                  'trading_symbol':contract['trading_symbol'],
                  'groww_symbol':contract['groww_symbol'],
                  'expiry':contract['expiry'],
                  'strike':contract['strike'],
                  'lot_size':contract['lot_size'],
                  'candles':len(rows),
                  'first_at':rows[0][0] if rows else None,
                  'last_at':rows[-1][0] if rows else None,
              })

          result={
              'mode':'CRUDE_OIL_MINI_PROVIDER_PARITY_GATE_V1',
              'research_only':True,
              'news_enabled':False,
              'live_execution_enabled':False,
              'regular_crude_used':False,
              'older_futures_contracts_used':False,
              'synthetic_option_prices_used':False,
              'quote_contract':qcontract,
              'live_last_price':last_price,
              'live_day_change':qpayload.get('day_change'),
              'live_day_change_pct':qpayload.get('day_change_perc'),
              'live_volume':qpayload.get('volume'),
              'live_open_interest':qpayload.get('open_interest'),
              'future_contract':universe['future'],
              'future_candles':len(future_rows),
              'future_first_at':future_rows[0][0] if future_rows else None,
              'future_last_at':future_rows[-1][0] if future_rows else None,
              'session_count':len(sessions),
              'complete_sessions':len(complete),
              'complete_session_first':complete[0]['date'] if complete else None,
              'complete_session_last':complete[-1]['date'] if complete else None,
              'nearest_option_expiry':expiry,
              'option_probes':option_probes,
              'ready_for_no_news_20_click_replay':len(complete)>=5,
              'ready_for_real_option_premium_scoring':all(x.get('candles',0)>0 for x in option_probes),
          }
          Path('crude-oil-mini-provider-parity.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))

          assert qcontract.get('trading_symbol') == 'CRUDEOILM21SEP26FUT', result
          assert universe['future']['trading_symbol'] == 'CRUDEOILM21SEP26FUT', result
          assert qcontract.get('lot_size') == 10, result
          assert last_price > 0, result
          assert future_rows, result
          assert len(complete) >= 5, result
          assert all(str(x.get('trading_symbol','')).startswith('CRUDEOILM') for x in option_probes), result
          assert all(x.get('lot_size') == 10 for x in option_probes if x.get('status') != 'CONTRACT_NOT_FOUND'), result
          assert result['ready_for_real_option_premium_scoring'] is True, result
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-provider-parity
          path: crude-oil-mini-provider-parity.json
          if-no-files-found: warn
          retention-days: 30
