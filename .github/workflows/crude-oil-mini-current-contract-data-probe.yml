name: Crude Oil Mini Current Contract Data Probe

on:
  pull_request:
    paths:
      - ".github/workflows/crude-oil-mini-current-contract-data-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify Mini probe helpers
        run: python -m unittest tests.test_crude_oil_mini_data_probe tests.test_groww_crude_oil_mini_provider -v

      - name: Wait for deployed Mini provider route
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..48}; do
            CODE=$(curl --silent --show-error --max-time 30 -o mini-quote.json -w "%{http_code}" \
              "$API_BASE/v1/quote/CRUDEOILM" || true)
            if [ "$CODE" = "200" ]; then
              python -m json.tool mini-quote.json
              exit 0
            fi
            echo "Mini provider not deployed yet: attempt=$attempt HTTP=$CODE"
            sleep 10
          done
          cat mini-quote.json 2>/dev/null || true
          exit 1

      - name: Probe current Mini future and real Mini option history
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import os
          from datetime import date
          from pathlib import Path

          import httpx

          from app.crude_oil_mini_contracts import (
              CRUDE_OIL_MINI,
              fetch_crude_oil_mini_master,
              resolve_crude_oil_mini_universe,
          )
          from app.crude_oil_mini_data_probe import (
              _close_near_mid_session,
              _complete_sessions,
              _nearest_option,
          )

          api = os.environ["API_BASE"].rstrip("/")

          def get_candles(symbol):
              with httpx.Client(timeout=180) as client:
                  response = client.get(f"{api}/v1/candles/{symbol}", params={"timeframe":"5m"})
                  response.raise_for_status()
                  body = response.json()
              return body.get("candles") or []

          future_rows = get_candles(CRUDE_OIL_MINI)
          sessions = _complete_sessions(future_rows)
          complete = [row for row in sessions if row["complete_for_20_click_research"]]
          if not complete:
              raise SystemExit("Current CRUDEOILM future returned no complete sessions")

          latest_complete = date.fromisoformat(complete[-1]["date"])
          reference = _close_near_mid_session(future_rows, latest_complete)
          if reference is None:
              raise SystemExit("Could not derive point-in-time Mini reference price")

          master = asyncio.run(fetch_crude_oil_mini_master())
          universe = resolve_crude_oil_mini_universe(master, date.today())
          option_expiry = universe["nearest_option_expiry"]
          option_probes = []
          for option_type in ("CE","PE"):
              contract = _nearest_option(
                  master,
                  expiry=option_expiry,
                  option_type=option_type,
                  price=reference,
              )
              if contract is None:
                  option_probes.append({"option_type":option_type,"status":"CONTRACT_NOT_FOUND"})
                  continue
              rows = get_candles(contract["trading_symbol"])
              option_probes.append({
                  "option_type":option_type,
                  "status":"AVAILABLE" if rows else "NO_CANDLES",
                  "trading_symbol":contract["trading_symbol"],
                  "groww_symbol":contract["groww_symbol"],
                  "expiry":contract["expiry"],
                  "strike":contract["strike"],
                  "lot_size":contract["lot_size"],
                  "reference_underlying":reference,
                  "all_returned_candles":len(rows),
                  "first_at":rows[0][0] if rows else None,
                  "last_at":rows[-1][0] if rows else None,
              })

          result = {
              "mode":"CRUDE_OIL_MINI_DEPLOYED_CURRENT_CONTRACT_DATA_PROBE_V1",
              "product":"CRUDE_OIL_MINI",
              "underlying_symbol":CRUDE_OIL_MINI,
              "research_only":True,
              "news_enabled":False,
              "live_execution_enabled":False,
              "older_futures_contracts_used":False,
              "regular_crude_used":False,
              "synthetic_option_prices_used":False,
              "future":universe["future"],
              "future_candles":len(future_rows),
              "future_first_at":future_rows[0][0] if future_rows else None,
              "future_last_at":future_rows[-1][0] if future_rows else None,
              "complete_sessions":len(complete),
              "complete_session_first":complete[0]["date"],
              "complete_session_last":complete[-1]["date"],
              "latest_complete_session":latest_complete.isoformat(),
              "nearest_option_expiry":option_expiry,
              "option_probes":option_probes,
              "option_premium_history_found":any(x.get("all_returned_candles",0)>0 for x in option_probes),
              "ready_for_20_click_no_news_replay":len(complete)>=5,
              "future_and_option_expiry_independent":universe["future_and_option_expiry_are_independent"],
          }
          Path("crude-oil-mini-current-contract-data-probe.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(result,indent=2,sort_keys=True))

          assert result["future"]["trading_symbol"] == "CRUDEOILM21SEP26FUT", result
          assert result["older_futures_contracts_used"] is False, result
          assert result["regular_crude_used"] is False, result
          assert result["synthetic_option_prices_used"] is False, result
          assert result["future_and_option_expiry_independent"] is True, result
          assert result["ready_for_20_click_no_news_replay"] is True, result
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-current-contract-data-probe
          path: crude-oil-mini-current-contract-data-probe.json
          if-no-files-found: warn
          retention-days: 30
