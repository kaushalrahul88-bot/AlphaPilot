name: Crude Oil Mini Current Contract Data Probe

on:
  pull_request:
    paths:
      - ".github/workflows/crude-oil-mini-current-contract-data-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify Mini probe helpers
        run: python -m unittest tests.test_crude_oil_mini_data_probe tests.test_groww_crude_oil_mini_provider -v
      - name: Diagnose deployed current Mini history
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import httpx
          from app.crude_oil_mini_data_probe import _complete_sessions

          api=os.environ["API_BASE"].rstrip("/")
          with httpx.Client(timeout=240) as client:
              response=client.get(f"{api}/v1/candles/CRUDEOILM",params={"timeframe":"5m"})
              response.raise_for_status()
              rows=(response.json().get("candles") or [])
          sessions=_complete_sessions(rows)
          result={
              "mode":"CRUDE_OIL_MINI_CURRENT_CONTRACT_COVERAGE_DIAGNOSTIC_V1",
              "trading_symbol":"CRUDEOILM21SEP26FUT",
              "future_candles":len(rows),
              "future_first_raw":rows[0][0] if rows else None,
              "future_last_raw":rows[-1][0] if rows else None,
              "session_count":len(sessions),
              "complete_sessions":sum(bool(x["complete_for_20_click_research"]) for x in sessions),
              "sessions":sessions,
              "older_contracts_used":False,
              "regular_crude_used":False,
              "news_enabled":False,
              "live_execution_enabled":False,
          }
          Path("crude-oil-mini-current-contract-data-probe.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          assert rows,"Groww returned no current Mini future candles"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-current-contract-data-probe
          path: crude-oil-mini-current-contract-data-probe.json
          if-no-files-found: warn
          retention-days: 30
