name: Crude Oil Mini 5m Tape Certification

on:
  pull_request:
    paths:
      - ".github/workflows/crude-oil-mini-current-contract-data-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      EXPECTED_DEPLOYMENT: fb04610f1cece0070e83876dc694611d5a472678
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Wait for exact timestamp-normalization deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            CODE=$(curl --silent --show-error --max-time 30 -o health.json -w "%{http_code}" "$API_BASE/health" || true)
            if [ "$CODE" = "200" ]; then
              DEPLOYED=$(python -c 'import json;print(json.load(open("health.json")).get("deployment_commit") or "")')
              echo "attempt=$attempt deployed=$DEPLOYED expected=$EXPECTED_DEPLOYMENT"
              if [ "$DEPLOYED" = "$EXPECTED_DEPLOYMENT" ]; then
                cat health.json
                exit 0
              fi
            fi
            sleep 10
          done
          cat health.json 2>/dev/null || true
          exit 1

      - name: Certify exact CRUDEOILM 5m tape
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from collections import Counter
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import httpx

          from app.crude_oil_mini_data_probe import _complete_sessions

          IST=ZoneInfo('Asia/Kolkata')
          api=os.environ['API_BASE'].rstrip('/')

          with httpx.Client(timeout=420) as client:
              q=client.get(f'{api}/v1/quote/CRUDEOILM')
              q.raise_for_status()
              quote=q.json()
              c=client.get(f'{api}/v1/candles/CRUDEOILM',params={'timeframe':'5m'})
              c.raise_for_status()
              rows=(c.json().get('candles') or [])

          contract=quote.get('contract') or {}
          parsed=[]
          timestamp_format_errors=[]
          ohlcv_errors=[]
          off_grid=[]
          for index,row in enumerate(rows):
              if not isinstance(row,(list,tuple)) or len(row)<5:
                  ohlcv_errors.append({'index':index,'reason':'ROW_SHAPE'})
                  continue
              stamp=row[0]
              if not isinstance(stamp,str):
                  timestamp_format_errors.append({'index':index,'value':stamp,'reason':'NOT_STRING'})
                  continue
              try:
                  dt=datetime.fromisoformat(stamp)
              except Exception:
                  timestamp_format_errors.append({'index':index,'value':stamp,'reason':'NOT_ISO'})
                  continue
              if dt.tzinfo is None or dt.utcoffset()!=timedelta(hours=5,minutes=30):
                  timestamp_format_errors.append({'index':index,'value':stamp,'reason':'NOT_IST_OFFSET_AWARE'})
                  continue
              dt=dt.astimezone(IST)
              parsed.append(dt)
              if dt.second!=0 or dt.microsecond!=0 or dt.minute%5!=0:
                  off_grid.append(stamp)
              try:
                  o,h,l,cl=[float(x) for x in row[1:5]]
                  vol=float(row[5]) if len(row)>5 and row[5] is not None else 0.0
                  if min(o,h,l,cl)<=0 or h<max(o,cl,l) or l>min(o,cl,h) or vol<0:
                      ohlcv_errors.append({'index':index,'timestamp':stamp,'reason':'INVALID_OHLCV'})
              except Exception:
                  ohlcv_errors.append({'index':index,'timestamp':stamp,'reason':'NON_NUMERIC_OHLCV'})

          stamps=[dt.isoformat() for dt in parsed]
          duplicate_count=sum(count-1 for count in Counter(stamps).values() if count>1)
          non_monotonic=sum(1 for a,b in zip(parsed,parsed[1:]) if b<=a)
          sessions=_complete_sessions(rows)
          complete=[s for s in sessions if s.get('complete_for_20_click_research')]

          # Point-in-time rule used by the Mini replay: a 5m bar that starts at T
          # becomes observable only at T+5m. A click at 10:00 may therefore use
          # the 09:55 bar, never the 10:00 bar.
          visibility_sample=None
          if parsed:
              first=parsed[0]
              visibility_sample={
                  'bar_start':first.isoformat(),
                  'visible_at':(first+timedelta(minutes=5)).isoformat(),
              }

          result={
              'mode':'CRUDE_OIL_MINI_5M_TAPE_CERTIFICATION_V1',
              'research_only':True,
              'news_enabled':False,
              'live_execution_enabled':False,
              'contract':contract,
              'raw_candles':len(rows),
              'parsed_candles':len(parsed),
              'first_at':rows[0][0] if rows else None,
              'last_at':rows[-1][0] if rows else None,
              'timestamp_format_errors':len(timestamp_format_errors),
              'timestamp_format_error_examples':timestamp_format_errors[:5],
              'duplicate_timestamp_count':duplicate_count,
              'non_monotonic_pairs':non_monotonic,
              'off_5m_grid_count':len(off_grid),
              'off_5m_grid_examples':off_grid[:5],
              'ohlcv_error_count':len(ohlcv_errors),
              'ohlcv_error_examples':ohlcv_errors[:5],
              'sessions':len(sessions),
              'complete_sessions':len(complete),
              'complete_session_first':complete[0]['date'] if complete else None,
              'complete_session_last':complete[-1]['date'] if complete else None,
              'bar_visibility_policy':'BAR_START_PLUS_5_MINUTES',
              'visibility_sample':visibility_sample,
              'regular_crude_used':False,
              'older_futures_contracts_used':False,
              'checks':{
                  'exact_mini_contract':contract.get('trading_symbol')=='CRUDEOILM21SEP26FUT',
                  'mini_lot_size_10':contract.get('lot_size')==10,
                  'all_timestamps_canonical_ist':len(timestamp_format_errors)==0 and len(parsed)==len(rows),
                  'strictly_increasing':non_monotonic==0,
                  'no_duplicate_timestamps':duplicate_count==0,
                  'five_minute_grid':len(off_grid)==0,
                  'valid_ohlcv':len(ohlcv_errors)==0,
                  'sufficient_complete_sessions':len(complete)>=5,
              },
          }
          result['certified_for_no_news_replay']=all(result['checks'].values())
          Path('crude-oil-mini-5m-tape-certification.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          assert result['certified_for_no_news_replay'] is True,result
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-5m-tape-certification
          path: crude-oil-mini-5m-tape-certification.json
          if-no-files-found: warn
          retention-days: 30
