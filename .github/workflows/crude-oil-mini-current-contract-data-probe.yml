name: Crude Oil Mini Current Contract Data Probe

on:
  pull_request:
    paths:
      - "app/crude_oil_mini_contracts.py"
      - "app/crude_oil_mini_data_probe.py"
      - "tests/test_crude_oil_mini_data_probe.py"
      - ".github/workflows/crude-oil-mini-current-contract-data-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROWW_API_KEY: ${{ secrets.GROWW_API_KEY }}
      GROWW_API_SECRET: ${{ secrets.GROWW_API_SECRET }}
      GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify probe helpers
        run: python -m unittest tests.test_crude_oil_mini_data_probe -v
      - name: Probe current CRUDEOILM futures and option-premium history
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from app.crude_oil_mini_data_probe import probe_current_crude_oil_mini_history
          from app.providers.groww_rate_limited import RateLimitedGrowwProvider

          if not ((os.getenv("GROWW_API_KEY") and os.getenv("GROWW_API_SECRET")) or os.getenv("GROWW_ACCESS_TOKEN")):
              raise SystemExit("Groww credentials are not exposed to this workflow")

          IST = ZoneInfo("Asia/Kolkata")
          provider = RateLimitedGrowwProvider(None)
          result = asyncio.run(probe_current_crude_oil_mini_history(
              provider,
              start=datetime(2026, 7, 1, 9, 0, tzinfo=IST),
              end=datetime(2026, 9, 1, 11, 30, tzinfo=IST),
          ))
          Path("crude-oil-mini-current-contract-data-probe.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps({
              "future": result["future"],
              "future_candles": result["future_candles"],
              "future_first_at": result["future_first_at"],
              "future_last_at": result["future_last_at"],
              "complete_sessions": result["complete_sessions"],
              "complete_session_first": result["complete_session_first"],
              "complete_session_last": result["complete_session_last"],
              "option_expiry_probed": result["option_expiry_probed"],
              "option_premium_history_found": result["option_premium_history_found"],
              "option_probe_successes": result["option_probe_successes"],
              "option_probe_attempts": result["option_probe_attempts"],
              "option_probes": result["option_probes"],
              "ready_for_no_news_brain_replay": result["ready_for_no_news_brain_replay"],
              "ready_for_option_premium_scoring": result["ready_for_option_premium_scoring"],
              "integrity": result["integrity"],
          }, indent=2, sort_keys=True))

          assert result["underlying_symbol"] == "CRUDEOILM", result
          assert result["future"]["trading_symbol"] == "CRUDEOILM21SEP26FUT", result
          assert result["older_futures_contracts_used"] is False, result
          assert result["integrity"]["regular_crude_used"] is False, result
          assert result["integrity"]["synthetic_option_prices_used"] is False, result
          assert result["news_enabled"] is False, result
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-current-contract-data-probe
          path: crude-oil-mini-current-contract-data-probe.json
          if-no-files-found: warn
          retention-days: 30
