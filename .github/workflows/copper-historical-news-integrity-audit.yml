name: Copper Historical News Integrity Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/copper_historical_news.py"
      - "app/copper_historical_news_integrity_audit.py"
      - "scripts/audit_copper_historical_news.py"
      - ".github/workflows/copper-historical-news-integrity-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit dependencies
        run: pip install -r requirements.txt
      - name: Fetch and audit historical Copper news outside Render
        run: python scripts/audit_copper_historical_news.py --output news-audit.json
      - name: Validate audited dataset
        run: |
          python - <<'PY'
          import json
          d=json.load(open("news-audit.json"))
          assert d["checks"]["no_rejected_in_accepted"]
          assert d["checks"]["duplicates_do_not_vote"]
          assert d["checks"]["uncertain_do_not_vote"]
          assert d["accepted_record_count"]>0
          print(json.dumps({k:d.get(k) for k in ("raw_record_count","classification_counts","accepted_record_count","accepted_dataset_sha256","checks","limitations")},indent=2))
          print("\nUNCERTAIN")
          for x in d.get("uncertain",[]): print(x["available_at"],"|",x["source"],"|",x["headline"],"|",x["reasons"])
          print("\nREJECTED")
          for x in d.get("rejected",[]): print(x["available_at"],"|",x["source"],"|",x["headline"],"|",x["reasons"])
          print("\nACCEPTED")
          for x in d.get("accepted",[]): print(x["available_at"],"|",x["source"],"|",x["headline"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copper-historical-news-integrity-audit
          path: news-audit.json
