name: Crude Oil Mini Literal Playbook Shadow V1

on:
  pull_request:
    paths:
      - "app/crude_oil_mini_literal_playbook_shadow.py"
      - "app/current_mind_crude_oil_mini_replay.py"
      - "tests/test_crude_oil_mini_literal_playbook_shadow.py"
      - ".github/workflows/crude-oil-mini-literal-playbook-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Verify literal confirmation semantics
        run: python -m unittest tests.test_crude_oil_mini_literal_playbook_shadow -v

      - name: Run frozen Aug-31 literal playbook shadow
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import httpx
          from app.commodity_time import parse_ist_timestamp
          from app.current_mind_crude_oil_mini_replay import evaluate_crude_oil_mini_current_mind_no_news
          from app.crude_oil_mini_literal_playbook_shadow import evaluate_literal_playbook_shadow

          FROZEN_END='2026-08-31'
          api=os.environ['API_BASE'].rstrip('/')
          with httpx.Client(timeout=420) as client:
              quote=client.get(f'{api}/v1/quote/CRUDEOILM').raise_for_status().json()
              raw_candles=client.get(f'{api}/v1/candles/CRUDEOILM',params={'timeframe':'5m'}).raise_for_status().json().get('candles') or []

          candles=[row for row in raw_candles if parse_ist_timestamp(row[0]).date().isoformat() <= FROZEN_END]
          baseline=evaluate_crude_oil_mini_current_mind_no_news(candles,quote.get('contract') or {})
          shadow=evaluate_literal_playbook_shadow(baseline)
          Path('crude-oil-mini-literal-playbook-shadow-v1.json').write_text(json.dumps(shadow,indent=2,sort_keys=True)+'\n')

          print(json.dumps({
              'frozen_research_end':FROZEN_END,
              'reference_contract':shadow['reference_contract'],
              'baseline_clicks':shadow['baseline_clicks'],
              'baseline_actionable_setups':shadow['baseline_actionable_setups'],
              'literal_confirmed_setups':shadow['literal_confirmed_setups'],
              'candidate_if_confirmation_were_required':shadow['candidate_if_confirmation_were_required'],
              'playbooks':shadow['playbooks'],
              'strategy_rules_changed':shadow['strategy_rules_changed'],
              'decision_effect':shadow['decision_effect'],
          },indent=2,sort_keys=True))

          assert baseline['reference_contract']=='CRUDEOILM21SEP26FUT',baseline['reference_contract']
          assert baseline['complete_sessions']==54,baseline
          assert baseline['evaluated_clicks']==1080,baseline
          assert max(baseline['complete_session_dates'])==FROZEN_END,baseline['complete_session_dates'][-3:]
          assert baseline['news_enabled'] is False
          assert baseline['option_market_data_used'] is False
          assert shadow['strategy_rules_changed'] is False
          assert shadow['decision_effect']=='SHADOW_ONLY'
          assert shadow['news_used'] is False
          assert shadow['option_market_data_used'] is False
          assert shadow['outcomes_used_to_define_confirmation_rules'] is False
          # Shadow performance is descriptive and is never a CI pass/fail gate.
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-literal-playbook-shadow-v1
          path: crude-oil-mini-literal-playbook-shadow-v1.json
          if-no-files-found: warn
          retention-days: 30
