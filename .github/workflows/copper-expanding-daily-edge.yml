name: Copper Expanding Daily Edge Replay

on:
  push:
    branches: [main]
    paths:
      - "app/copper_research_brain.py"
      - ".github/workflows/copper-expanding-daily-edge.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - name: Wait for deployed route and run expanding daily replay
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            code=$(curl --silent --output result.json --write-out "%{http_code}" --max-time 120               -H 'Content-Type: application/json'               -X POST "$API_BASE/v1/research/copper/expanding-daily-edge-stored-v1"               -d '{"days":3650,"sample_every_bars":3,"round_trip_cost_bps":4.0}' || true)
            if [ "$code" = "200" ]; then
              python - <<'PY'
          import json
          d=json.load(open("result.json"))
          b=d["backtest"]
          print(json.dumps({
            "coverage":d["coverage"],
            "calendar_days_observed":b["calendar_days_observed"],
            "test_days":b["test_days"],
            "days_with_hypothesis":b["days_with_hypothesis"],
            "days_with_test_signals":b["days_with_test_signals"],
            "days_without_edge":b["days_without_edge"],
            "aggregate":b["aggregate"],
            "daily_results":b["daily_results"],
          },indent=2))
          PY
              exit 0
            fi
            sleep 10
          done
          cat result.json || true
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copper-expanding-daily-edge-v1
          path: result.json
          if-no-files-found: warn
