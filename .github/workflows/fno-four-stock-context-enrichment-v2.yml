name: F&O Four-Stock Context Enrichment V2

on:
  pull_request:
    paths:
      - 'app/fno_four_stock_context_enrichment_v2.py'
      - 'app/fno_four_stock_context_replay_v2.py'
      - 'app/fno_four_stock_context_replay_api_v2.py'
      - 'data/fno_four_stock_context_events_v2.json'
      - 'tests/test_fno_four_stock_context_enrichment_v2.py'
      - 'app/__init__.py'
      - '.github/workflows/fno-four-stock-context-enrichment-v2.yml'
  push:
    branches: [main]
    paths:
      - 'app/fno_four_stock_context_enrichment_v2.py'
      - 'app/fno_four_stock_context_replay_v2.py'
      - 'app/fno_four_stock_context_replay_api_v2.py'
      - 'data/fno_four_stock_context_events_v2.json'
      - 'tests/test_fno_four_stock_context_enrichment_v2.py'
      - 'app/__init__.py'
      - '.github/workflows/fno-four-stock-context-enrichment-v2.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_fno_four_stock_context_enrichment_v2.py tests/test_fno_four_stock_context_enrichment_v1.py tests/test_fno_four_stock_context_replay_v1.py
      - run: python -m py_compile app/fno_four_stock_context_enrichment_v2.py app/fno_four_stock_context_replay_v2.py app/fno_four_stock_context_replay_api_v2.py app/__init__.py

  replay:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: alphapilot-production-heavy-render-job
      cancel-in-progress: false
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      COLLECTOR_TOKEN: ${{ secrets.COMMODITY_COLLECTOR_TOKEN }}
    steps:
      - name: Wait for deployed V2 endpoint
        run: |
          set -euo pipefail
          test -n "$COLLECTOR_TOKEN"
          for i in {1..120}; do
            if curl -fsS --max-time 20 "$API_BASE/health" -o health.json; then
              DEPLOYED=$(python -c 'import json;print(json.load(open("health.json")).get("deployment_commit") or "")')
              echo "Render commit: $DEPLOYED; expected: $GITHUB_SHA"
              if [ "$DEPLOYED" = "$GITHUB_SHA" ]; then
                if curl -fsS --max-time 20 "$API_BASE/openapi.json" -o openapi.json && python -c 'import json,sys;p=json.load(open("openapi.json")).get("paths",{});sys.exit(0 if "/v1/internal/fno/four-stock-context-replay-v2/start" in p else 1)'; then
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for Render V2 deployment"
          exit 1
      - name: Start V2 context replay
        run: |
          set -euo pipefail
          if curl -fsS --max-time 30 -H "X-Collector-Token: $COLLECTOR_TOKEN" -X POST "$API_BASE/v1/internal/fno/four-stock-context-replay-v2/start" -o start.json; then
            cat start.json
          else
            echo "Start request timed out or failed; durable polling will determine whether the run started"
          fi
      - name: Poll V2 context replay
        run: |
          set -euo pipefail
          : > status.json
          for i in {1..180}; do
            if curl -fsS --max-time 30 -H "X-Collector-Token: $COLLECTOR_TOKEN" "$API_BASE/v1/internal/fno/four-stock-context-replay-v2/status" -o status.json; then
              STATE=$(python -c 'import json;print(json.load(open("status.json")).get("status","UNKNOWN"))')
              python -c 'import json;d=json.load(open("status.json"));print("state:",d.get("status"),"attempt:",d.get("attempt_count"),"progress:",d.get("progress"))'
              if [ "$STATE" = "COMPLETED" ]; then break; fi
              if [ "$STATE" = "FAILED" ]; then cat status.json; exit 1; fi
            else
              echo "Transient V2 status request failure; retrying durable run"
            fi
            sleep 15
          done
          test -s status.json
          test "$(python -c 'import json;print(json.load(open("status.json")).get("status",""))')" = "COMPLETED"
      - name: Fetch and validate V2 comparison
        run: |
          set -euo pipefail
          curl -fsS --max-time 180 -H "X-Collector-Token: $COLLECTOR_TOKEN" "$API_BASE/v1/internal/fno/four-stock-context-replay-v2/result" -o result.json
          python - <<'PY'
          import json
          d=json.load(open('result.json'))
          assert d['status']=='COMPLETED'
          assert d['experiment']['baseline_observations']==1600
          assert d['experiment']['observations']==1600
          assert d['experiment']['same_frozen_clicks'] is True
          assert d['experiment']['same_frozen_future_tape'] is True
          assert d['context_audit']['lookahead_violations']==0
          assert d['safety']['decision_thresholds_identical_to_v1'] is True
          assert d['safety']['thresholds_retuned_from_v1_results'] is False
          assert d['safety']['options_read'] is False and d['safety']['futures_read'] is False
          summary={k:d[k] for k in ('experiment','baseline_summary','enriched_summary','comparison','context_audit','by_stock','methodology','safety')}
          json.dump(summary,open('summary.json','w'),indent=2,sort_keys=True)
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fno-four-stock-context-enrichment-v2
          path: |
            result.json
            summary.json
