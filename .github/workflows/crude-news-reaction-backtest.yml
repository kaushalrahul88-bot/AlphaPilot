name: Crude News Reaction Backtest

on:
  pull_request:
    paths:
      - "app/crude_*.py"
      - "tests/test_crude_news_intelligence.py"
      - ".github/workflows/crude-news-reaction-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crude-news-reaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reaction-audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_BASE: https://alphapilot-api-pnio.onrender.com
      COLLECTOR_TOKEN: ${{ secrets.COMMODITY_COLLECTOR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Run unit tests for Crude news intelligence
        run: python -m unittest tests.test_crude_news_intelligence -v

      - name: Backfill exact historical Crude event sessions from Groww
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COLLECTOR_TOKEN"
          curl --silent --show-error --max-time 20 "$API_BASE/health" >/dev/null || true
          for RANGE in \
            "2026-08-18T09:00:00+05:30|2026-08-18T23:30:00+05:30" \
            "2026-08-31T09:00:00+05:30|2026-08-31T23:30:00+05:30"
          do
            IFS='|' read -r START_AT END_AT <<< "$RANGE"
            PAYLOAD=$(python - "$START_AT" "$END_AT" <<'PY'
          import json,sys
          print(json.dumps({
              "symbol":"CRUDEOIL",
              "start_at":sys.argv[1],
              "end_at":sys.argv[2],
              "timeframe_minutes":5,
          }))
          PY
            )

            CODE=$(curl --silent --show-error --max-time 120 -w "%{http_code}" \
              -H "X-Collector-Token: $COLLECTOR_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST "$API_BASE/v1/internal/commodity-candles/backfill-continuous" \
              --data "$PAYLOAD" -o backfill.json || echo "000")
            echo "Continuous Crude backfill $START_AT HTTP=$CODE"

            if [ "$CODE" != "200" ]; then
              cat backfill.json 2>/dev/null || true
              echo "Archived-contract discovery unavailable; trying the currently listed Crude contract as a bounded data-availability fallback."
              CODE=$(curl --silent --show-error --max-time 120 -w "%{http_code}" \
                -H "X-Collector-Token: $COLLECTOR_TOKEN" \
                -H "Content-Type: application/json" \
                -X POST "$API_BASE/v1/internal/commodity-candles/backfill" \
                --data "$PAYLOAD" -o backfill.json || echo "000")
              echo "Current-contract Crude backfill $START_AT HTTP=$CODE"
            fi

            [ "$CODE" = "200" ] || { cat backfill.json 2>/dev/null || true; exit 1; }
            python - <<'PY'
          import json
          d=json.load(open("backfill.json"))
          assert d.get("symbol")=="CRUDEOIL",d
          assert d.get("timeframe_minutes")==5,d
          assert d.get("status") in {"BACKFILLED","BACKFILLED_CONTINUOUS","NO_ARCHIVED_INTRADAY_DATA"},d
          print(json.dumps({k:d.get(k) for k in (
              "status","contract","contract_expiry","start","end","fetched","completed","upserted",
              "usable_for_continuous_research","data_limitation"
          )},indent=2,sort_keys=True))
          PY
          done

      - name: Read stored MCX Crude candles and score frozen news reactions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python - <<'PY'
          import asyncio
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from app.commodity_candle_collector import PostgresCandleStore
          from app.crude_historical_news import crude_historical_news_metadata_v1
          from app.crude_news_reaction_backtest import evaluate_crude_news_reactions

          IST=ZoneInfo("Asia/Kolkata")
          start=datetime(2026,8,17,0,0,tzinfo=IST)
          end=datetime(2026,9,1,23,59,59,tzinfo=IST)
          store=PostgresCandleStore(os.environ["DATABASE_URL"])
          candles=asyncio.run(store.read_symbol("CRUDEOIL",5,start,end))
          result=evaluate_crude_news_reactions(candles)
          result["data_window"]={
              "requested_start":start.isoformat(),
              "requested_end":end.isoformat(),
              "first_candle":candles[0][0] if candles else None,
              "last_candle":candles[-1][0] if candles else None,
              "stored_candles":len(candles),
          }
          result["news_metadata"]=crude_historical_news_metadata_v1()
          Path("crude-news-reaction-backtest.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps({
              "status":result["status"],
              "data_window":result["data_window"],
              "news_counts":result["news_counts"],
              "scored_directional_events":result["scored_directional_events"],
              "skipped":result["skipped"],
              "summary":result["summary"],
          },indent=2,sort_keys=True))
          assert result["classification_frozen_before_outcomes_attached"] is True
          assert result["production_rules_changed"] is False
          assert result["live_execution_enabled"] is False
          assert result["option_premium_scored"] is False
          assert result["input_candles"] > 0, "Groww returned no CRUDEOIL 5m candles for either exact event session"
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-news-reaction-backtest
          path: crude-news-reaction-backtest.json
          if-no-files-found: warn
          retention-days: 30
