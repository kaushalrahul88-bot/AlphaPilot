name: Crude News Reaction Backtest

on:
  pull_request:
    paths:
      - "app/crude_*.py"
      - "tests/test_crude_news_intelligence.py"
      - ".github/workflows/crude-news-reaction-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crude-news-reaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reaction-audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Run unit tests for Crude news intelligence
        run: python -m unittest tests.test_crude_news_intelligence -v

      - name: Read stored MCX Crude candles and score frozen news reactions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python - <<'PY'
          import asyncio
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from app.commodity_candle_collector import PostgresCandleStore
          from app.crude_historical_news import crude_historical_news_metadata_v1
          from app.crude_news_reaction_backtest import evaluate_crude_news_reactions

          IST=ZoneInfo("Asia/Kolkata")
          start=datetime(2026,8,17,0,0,tzinfo=IST)
          end=datetime(2026,9,1,23,59,59,tzinfo=IST)
          store=PostgresCandleStore(os.environ["DATABASE_URL"])
          candles=asyncio.run(store.read_symbol("CRUDEOIL",5,start,end))
          result=evaluate_crude_news_reactions(candles)
          result["data_window"]={
              "requested_start":start.isoformat(),
              "requested_end":end.isoformat(),
              "first_candle":candles[0][0] if candles else None,
              "last_candle":candles[-1][0] if candles else None,
              "stored_candles":len(candles),
          }
          result["news_metadata"]=crude_historical_news_metadata_v1()
          Path("crude-news-reaction-backtest.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps({
              "status":result["status"],
              "data_window":result["data_window"],
              "news_counts":result["news_counts"],
              "scored_directional_events":result["scored_directional_events"],
              "skipped":result["skipped"],
              "summary":result["summary"],
          },indent=2,sort_keys=True))
          assert result["classification_frozen_before_outcomes_attached"] is True
          assert result["production_rules_changed"] is False
          assert result["live_execution_enabled"] is False
          assert result["option_premium_scored"] is False
          assert result["input_candles"] > 0, "No stored CRUDEOIL 5m candles in requested window"
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-news-reaction-backtest
          path: crude-news-reaction-backtest.json
          if-no-files-found: warn
          retention-days: 30
