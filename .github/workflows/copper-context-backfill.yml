name: Copper Authoritative Context Backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/copper_context_ingestion.py"
      - ".github/workflows/copper-context-backfill.yml"
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "psycopg[binary]>=3.2"
      - name: Fetch and persist CFTC + USDINR context
        run: |
          python - <<'PY'
          import os
          from app.copper_context_ingestion import fetch_cftc_copper_positioning,fetch_fred_usdinr_daily
          from app.historical_context import PostgresHistoricalContextStore
          s=PostgresHistoricalContextStore(os.environ["DATABASE_URL"]);s.initialize()
          cot=fetch_cftc_copper_positioning("2026-05-01","2026-08-29")
          cftc_upserted=s.upsert(cot)
          print({"cftc_upserted":cftc_upserted,"status_after_cftc":s.status("COPPER")})
          fx=fetch_fred_usdinr_daily("2026-05-01","2026-08-29")
          usdinr_upserted=s.upsert(fx)
          print({"usdinr_upserted":usdinr_upserted,"status":s.status("COPPER")})
          PY
