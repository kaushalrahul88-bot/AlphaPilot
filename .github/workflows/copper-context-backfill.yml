name: Copper Authoritative Context Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 2-6"
  push:
    branches: [main]
    paths:
      - "app/copper_context_ingestion.py"
      - ".github/workflows/copper-context-backfill.yml"

permissions:
  contents: read

concurrency:
  group: copper-authoritative-context-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "psycopg[binary]>=3.2"
      - name: Fetch and persist recent CFTC + USDINR context
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from app.copper_context_ingestion import fetch_cftc_copper_positioning, fetch_fred_usdinr_daily
          from app.historical_context import PostgresHistoricalContextStore

          end = datetime.now(timezone.utc).date()
          start = end - timedelta(days=45)

          store = PostgresHistoricalContextStore(os.environ["DATABASE_URL"])
          store.initialize()

          cot = fetch_cftc_copper_positioning(start.isoformat(), end.isoformat())
          cftc_upserted = store.upsert(cot)

          fx = fetch_fred_usdinr_daily(start.isoformat(), end.isoformat())
          usdinr_upserted = store.upsert(fx)

          print({
              "window_start": start.isoformat(),
              "window_end": end.isoformat(),
              "cftc_rows_fetched": len(cot),
              "cftc_upserted": cftc_upserted,
              "usdinr_rows_fetched": len(fx),
              "usdinr_upserted": usdinr_upserted,
              "status": store.status("COPPER"),
          })
          PY
