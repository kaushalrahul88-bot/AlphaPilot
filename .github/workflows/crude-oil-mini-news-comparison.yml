name: Crude Oil Mini No-News vs PIT News V1

on:
  pull_request:
    paths:
      - "app/crude_oil_mini_historical_news_v1.py"
      - "app/crude_oil_mini_news_replay.py"
      - "tests/test_crude_oil_mini_news_replay.py"
      - ".github/workflows/crude-oil-mini-news-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Verify news replay causal mechanics
        run: python -m unittest tests.test_crude_oil_mini_news_replay -v

      - name: Run exact-click no-news versus news comparison
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import httpx

          from app.crude_oil_mini_no_news_brain import _ts
          from app.crude_oil_mini_news_replay import evaluate_crude_oil_mini_news_comparison

          api=os.environ['API_BASE'].rstrip('/')
          with httpx.Client(timeout=420) as client:
              quote_response=client.get(f'{api}/v1/quote/CRUDEOILM')
              quote_response.raise_for_status()
              quote=quote_response.json()
              candle_response=client.get(f'{api}/v1/candles/CRUDEOILM',params={'timeframe':'5m'})
              candle_response.raise_for_status()
              raw_candles=(candle_response.json().get('candles') or [])

          # Freeze the exact historical information window used by the already-completed
          # no-news baseline. Later current-contract bars must not create extra clicks.
          candles=[row for row in raw_candles if _ts(row[0]).date().isoformat() <= '2026-08-26']
          contract=quote.get('contract') or {}
          result=evaluate_crude_oil_mini_news_comparison(candles,contract)
          Path('crude-oil-mini-no-news-vs-pit-news-v1.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'mode':result['mode'],
              'reference_contract':result['reference_contract'],
              'data':result['data'],
              'news_metadata':result['news_metadata'],
              'click_identity_exact':result['click_identity_exact'],
              'baseline_all':result['baseline']['all'],
              'with_news_all':result['with_news']['all'],
              'delta_all':result['delta']['all'],
              'changed_clicks':result['changed_clicks'],
              'action_change_counts':result['action_change_counts'],
              'changed_baseline_outcomes':result['changed_baseline_outcomes'],
              'changed_news_outcomes':result['changed_news_outcomes'],
          },indent=2,sort_keys=True))

          assert contract.get('trading_symbol')=='CRUDEOILM21SEP26FUT',result
          assert result['reference_contract']=='CRUDEOILM21SEP26FUT',result
          assert result['data']['complete_sessions']==51,result['data']
          assert result['data']['total_clicks']==1020,result['data']
          assert result['click_identity_exact'] is True,result
          assert result['comparison_design']['same_clicks'] is True,result
          assert result['comparison_design']['only_added_input']=='POINT_IN_TIME_CRUDE_NEWS_INTELLIGENCE',result
          assert result['historical_option_premium_scoring'] is False,result
          assert (result['news_metadata'].get('news_intelligence_counts') or {}).get('ALLOW',0)>0,result['news_metadata']
          # Performance is descriptive; it is intentionally NOT a CI pass/fail gate.
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-no-news-vs-pit-news-v1
          path: crude-oil-mini-no-news-vs-pit-news-v1.json
          if-no-files-found: warn
          retention-days: 30
