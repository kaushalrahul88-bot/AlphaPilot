name: Crude Oil Mini Current Mind Error Attribution V1

on:
  pull_request:
    paths:
      - "app/crude_oil_mini_current_mind_error_attribution.py"
      - "app/crude_oil_mini_market_perception.py"
      - "app/crude_oil_mini_experience_memory.py"
      - "app/crude_oil_mini_current_mind.py"
      - "app/current_mind_crude_oil_mini_replay.py"
      - ".github/workflows/crude-oil-mini-error-attribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run frozen no-news Current Mind and attribution
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import httpx
          from app.current_mind_crude_oil_mini_replay import evaluate_crude_oil_mini_current_mind_no_news
          from app.crude_oil_mini_current_mind_error_attribution import evaluate_error_attribution

          api=os.environ['API_BASE'].rstrip('/')
          with httpx.Client(timeout=420) as client:
              quote=client.get(f'{api}/v1/quote/CRUDEOILM').raise_for_status().json()
              candles=client.get(f'{api}/v1/candles/CRUDEOILM',params={'timeframe':'5m'}).raise_for_status().json().get('candles') or []
          baseline=evaluate_crude_oil_mini_current_mind_no_news(candles,quote.get('contract') or {})
          audit=evaluate_error_attribution(baseline)
          Path('crude-oil-mini-error-attribution-v1.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'reference_contract':audit['reference_contract'],
              'clicks':audit['clicks'],
              'trade_observations':audit['trade_observations'],
              'overall':audit['overall'],
              'stable_above_50_pct_states':audit['stable_above_50_pct_states'],
              'stable_below_50_pct_states':audit['stable_below_50_pct_states'],
          },indent=2,sort_keys=True))
          assert baseline['news_enabled'] is False
          assert baseline['option_market_data_used'] is False
          assert baseline['click_coverage_exact'] is True
          assert audit['strategy_rules_changed'] is False
          assert audit['news_used'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-current-mind-error-attribution-v1
          path: crude-oil-mini-error-attribution-v1.json
          if-no-files-found: warn
          retention-days: 30
