name: Crude Current Contract News Comparison

on:
  pull_request:
    paths:
      - "app/crude_current_contract_news_shadow.py"
      - "app/current_mind_crude_no_news.py"
      - "app/crude_random_click_replay.py"
      - "tests/test_crude_current_contract_news_shadow.py"
      - ".github/workflows/crude-current-contract-news-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify news-shadow causal guards
        run: python -m unittest tests.test_crude_current_contract_news_shadow -v

      - name: Compare no-news vs news on identical current-contract candles and clicks
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python - <<'PY'
          import asyncio,json,os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import psycopg

          from app.crude_current_contract_news_shadow import REFERENCE_CONTRACT, run_same_click_news_comparison
          from app.crude_research_brain import read_exact_crude_contract_from_store

          IST=ZoneInfo("Asia/Kolkata")
          start=datetime(2026,8,3,9,0,tzinfo=IST)
          end=datetime(2026,8,31,23,30,tzinfo=IST)
          contract=REFERENCE_CONTRACT

          with psycopg.connect(os.environ["DATABASE_URL"],connect_timeout=10) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("""
                      SELECT COUNT(*),MIN(candle_at),MAX(candle_at),MAX(expiry_date)
                      FROM commodity_candles
                      WHERE provider='GROWW' AND symbol='CRUDEOIL'
                        AND trading_symbol=%s AND timeframe_minutes=5
                        AND candle_at >= %s AND candle_at <= %s
                  """,(contract,start,end))
                  count,first_at,last_at,expiry=cursor.fetchone()

          assert count and int(count)>0,f"No stored current-contract candles for {contract}"
          candles=asyncio.run(read_exact_crude_contract_from_store(
              os.environ["DATABASE_URL"],contract,start,end
          ))
          result=run_same_click_news_comparison(
              candles,trading_symbol=contract,clicks_per_session=20
          )
          result["contract_selection"]={
              "method":"FROZEN_CURRENT_CONTRACT_ONLY",
              "trading_symbol":contract,
              "expiry_date":expiry.isoformat() if expiry else None,
              "stored_rows":int(count),
              "first_at":first_at.isoformat() if first_at else None,
              "last_at":last_at.isoformat() if last_at else None,
              "older_contracts_used":False,
          }
          Path("crude-current-contract-news-comparison.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps({
              "mode":result["mode"],
              "contract_selection":result["contract_selection"],
              "coverage":result["coverage"],
              "no_news":result["no_news"],
              "with_news":result["with_news"],
              "decision_delta":result["decision_delta"],
              "score_delta":result["score_delta"],
              "changed_decisions":result["changed_decisions"],
          },indent=2,sort_keys=True))

          assert result["trading_symbol"]==contract
          assert result["same_candles"] is True
          assert result["same_click_schedule"] is True
          assert result["decision_frozen_before_outcome_attached"] is True
          assert result["news_window_tuned_on_crude_outcomes"] is False
          assert result["coverage"]["exact_click_coverage"] is True
          assert result["coverage"]["sessions"]==21
          assert result["coverage"]["scheduled_clicks"]==420
          assert result["coverage"]["evaluated_clicks"]==420
          assert result["no_news"]["actions"].get("BUY",0)==83
          assert result["no_news"]["actions"].get("WAIT",0)==337
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-current-contract-news-comparison
          path: crude-current-contract-news-comparison.json
          if-no-files-found: warn
          retention-days: 30
