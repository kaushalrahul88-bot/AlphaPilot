name: Copper Current Mind PIT Reaudit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/copper-current-mind-pit-reaudit.yml"
      - "app/current_mind_integrated_replay.py"
      - "app/current_mind_copper_replay.py"
      - "app/current_mind_thesis_builder.py"
      - "app/setup_playbook_selector.py"
      - "app/trader_experience_memory.py"
      - "app/trader_evidence_synthesis.py"
      - "app/market_news_catalyst_control.py"
      - "app/market_news_thesis_interaction.py"
      - "app/playbook_pattern_confirmation_shadow.py"
      - "scripts/audit_market_news_reactions.py"
      - "scripts/audit_market_news_thesis_interaction.py"
      - "scripts/audit_playbook_pattern_gate_shadow.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: copper-current-mind-pit-reaudit
  cancel-in-progress: false

jobs:
  reaudit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      EXPANDED_NEWS_RUN_ID: "33357324842"
      EXPANDED_NEWS_ARTIFACT: "copper-current-mind-expanded-68-news-replay"
      FROZEN_CANDLES_RUN_ID: "33405492674"
      FROZEN_CANDLES_ARTIFACT: "copper-frozen-reaction-candles"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download frozen point-in-time inputs
        run: |
          set -euo pipefail
          mkdir -p news-source frozen-candles
          gh run download "$EXPANDED_NEWS_RUN_ID" --name "$EXPANDED_NEWS_ARTIFACT" --dir news-source
          gh run download "$FROZEN_CANDLES_RUN_ID" --name "$FROZEN_CANDLES_ARTIFACT" --dir frozen-candles
          test -f news-source/expanded-news-payload.json
          test -f frozen-candles/copper-frozen-reaction-candles.json

      - name: Re-run corrected Current Mind baseline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from app.copper_market_brain_abstention_audit import normalize_candle_rows
          from app.current_mind_copper_replay import evaluate_current_mind_replay

          payload=json.loads(Path("frozen-candles/copper-frozen-reaction-candles.json").read_text())
          candles=list(payload.get("candles") or payload.get("records") or []) if isinstance(payload,dict) else list(payload or [])
          rows=normalize_candle_rows(candles)
          report=evaluate_current_mind_replay(rows)
          Path("copper-current-mind-pit-reaudit-baseline.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")

          assert report["mode"]=="COPPER_CURRENT_MIND_20_CLICK_REPLAY_V1",report
          assert report["scheduled_clicks"]==360,report
          assert report["evaluated_clicks"]==360,report
          assert report["click_coverage_exact"] is True,report
          decisions=list(report.get("decisions") or [])
          assert len(decisions)==360,report
          assert all((d.get("memory_visibility") or {}).get("mode")=="POINT_IN_TIME_DECISION_MEMORY_V1" for d in decisions),report
          assert all((d.get("memory_visibility") or {}).get("same_timestamp_allowed") is False for d in decisions),report
          assert all((d.get("memory_visibility") or {}).get("unknown_availability_policy")=="WITHHOLD" for d in decisions),report

          visibility=Counter()
          total_withheld=0
          total_visible=0
          for d in decisions:
              mv=d.get("memory_visibility") or {}
              total_withheld+=int(mv.get("withheld_cases") or 0)
              total_visible+=int(mv.get("visible_cases") or 0)
              visibility["clicks_with_withheld_memory"]+=int((mv.get("withheld_cases") or 0)>0)
              visibility["clicks_with_visible_memory"]+=int((mv.get("visible_cases") or 0)>0)
          summary={k:report.get(k) for k in (
              "reference_contract","candles","complete_sessions","excluded_partial_sessions",
              "scheduled_clicks","evaluated_clicks","actions","trades","resolved_trades",
              "targets","stops","no_entry","session_end","expectancy_r_resolved",
              "missed_large_moves_after_abstention"
          )}
          summary["memory_visibility"]={**visibility,"visible_case_observations":total_visible,"withheld_case_observations":total_withheld}
          print("PIT_CORRECTED_CURRENT_MIND_BASELINE")
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Re-run catalyst and literal-playbook shadows
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/audit_market_news_thesis_interaction.py \
            --news news-source/expanded-news-payload.json \
            --candles frozen-candles/copper-frozen-reaction-candles.json \
            --output copper-news-thesis-interaction-pit-reaudit.json
          python scripts/audit_playbook_pattern_gate_shadow.py \
            --thesis-report copper-news-thesis-interaction-pit-reaudit.json \
            --output copper-playbook-pattern-gate-pit-reaudit.json

      - name: Verify outcome-blind invariants and summarize
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          baseline=json.loads(Path("copper-current-mind-pit-reaudit-baseline.json").read_text())
          thesis=json.loads(Path("copper-news-thesis-interaction-pit-reaudit.json").read_text())
          gate=json.loads(Path("copper-playbook-pattern-gate-pit-reaudit.json").read_text())

          assert thesis["research_only"] is True and thesis["descriptive_only"] is True,thesis
          assert thesis["shadow_policy"]["outcome_blind"] is True,thesis
          assert thesis["shadow_policy"]["changes_decision"] is False,thesis
          assert thesis["outcome_integrity"]["outcomes_read_for_thesis_interaction_shadow"] is False,thesis
          assert thesis["outcome_integrity"]["outcomes_read_for_pattern_confirmation_shadow"] is False,thesis
          assert thesis["clicks"]==baseline["evaluated_clicks"]==360,(thesis,baseline)
          assert len(thesis["rows"])==360,thesis
          assert gate["research_only"] is True and gate["shadow_only"] is True,gate
          assert gate["candidate_policy"]["can_create_trade"] is False,gate
          assert gate["candidate_policy"]["can_reverse_direction"] is False,gate
          assert gate["candidate_policy"]["can_upgrade_abstention"] is False,gate
          assert gate["candidate_policy"]["promotion_from_august_result_allowed"] is False,gate
          assert gate["candidate_policy"]["untouched_forward_validation_required"] is True,gate
          assert gate["clicks"]==360 and len(gate["rows"])==360,gate
          assert sum(gate["baseline"]["actions"].values())==360,gate
          assert gate["baseline"]["trades"]==baseline["trades"],(gate["baseline"],baseline)
          assert gate["baseline"]["resolved_trades"]==baseline["resolved_trades"],(gate["baseline"],baseline)
          assert gate["changed_clicks"]==gate["baseline"]["trades"]-gate["pattern_gate"]["trades"],gate

          print("PIT_REAUDIT_SHADOW_SUMMARY")
          print(json.dumps({
              "baseline":{k:baseline.get(k) for k in ("actions","trades","resolved_trades","targets","stops","no_entry","session_end","expectancy_r_resolved")},
              "catalyst_control_counts":thesis.get("catalyst_control_counts"),
              "thesis_interaction_counts":thesis.get("thesis_interaction_counts"),
              "playbook_semantic_status_counts":thesis.get("playbook_semantic_status_counts"),
              "pattern_confirmation_status_counts":thesis.get("pattern_confirmation_status_counts"),
              "active_opposing_rows":len(thesis.get("active_opposing_rows") or []),
              "pattern_gate":gate.get("pattern_gate"),
              "pattern_gate_delta":gate.get("delta"),
              "changed_clicks":gate.get("changed_clicks"),
              "suppressed_baseline_outcomes":gate.get("suppressed_baseline_outcomes"),
              "validation_status":gate.get("validation_status"),
          },indent=2,sort_keys=True))
          PY

      - name: Write re-audit manifest
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          baseline=json.loads(Path("copper-current-mind-pit-reaudit-baseline.json").read_text())
          manifest={
              "mode":"COPPER_CURRENT_MIND_PIT_REAUDIT_V1",
              "commit":os.environ.get("GITHUB_SHA"),
              "expanded_news":{"run_id":os.environ["EXPANDED_NEWS_RUN_ID"],"artifact":os.environ["EXPANDED_NEWS_ARTIFACT"]},
              "frozen_candles":{"run_id":os.environ["FROZEN_CANDLES_RUN_ID"],"artifact":os.environ["FROZEN_CANDLES_ARTIFACT"]},
              "network_refetch":False,
              "point_in_time_decision_memory":"POINT_IN_TIME_DECISION_MEMORY_V1",
              "scheduled_clicks":baseline.get("scheduled_clicks"),
              "evaluated_clicks":baseline.get("evaluated_clicks"),
              "production_rules_changed":False,
              "live_execution_enabled":False,
              "rule":"Re-audit the frozen August Current Mind and outcome-blind catalyst/playbook shadows after PIT memory corrections. Historical August outcomes may describe the corrected replay but may not promote or tune candidate gates; untouched forward validation remains required.",
          }
          Path("copper-current-mind-pit-reaudit-manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copper-current-mind-pit-reaudit
          path: |
            copper-current-mind-pit-reaudit-baseline.json
            copper-news-thesis-interaction-pit-reaudit.json
            copper-playbook-pattern-gate-pit-reaudit.json
            copper-current-mind-pit-reaudit-manifest.json
          if-no-files-found: warn
          retention-days: 30
