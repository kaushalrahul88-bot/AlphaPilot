name: Copper Current Mind Expanded 68 News Replay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/main.py"
      - "app/current_mind_copper_replay.py"
      - "app/copper_news_persistence.py"
      - "app/commodity_time.py"
      - "app/copper_news_intelligence.py"
      - "app/copper_historical_news_integrity_audit.py"
      - "scripts/reaudit_frozen_copper_news.py"
      - "scripts/build_expanded_68_news_payload.py"
      - "research/copper_expanded_raw_historical_news_snapshot_v1.json"
      - ".github/workflows/copper-current-mind-expanded-68-news.yml"
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      COLLECTOR_TOKEN: ${{ secrets.COMMODITY_COLLECTOR_TOKEN }}
      SOURCE_ARTIFACT_ID: "9731584724"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download frozen source and re-audit locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > source.zip
          unzip -q source.zip -d frozen
          PYTHONPATH=. python -m scripts.reaudit_frozen_copper_news --source frozen/news-audit.json --output news-audit-v2.json
      - name: Wait for exact Render commit
        run: |
          set -euo pipefail; test -n "$COLLECTOR_TOKEN"
          for i in {1..75}; do
            if curl -fsS --max-time 20 "$API_BASE/health" -o h.json; then D=$(python -c 'import json;print(json.load(open("h.json")).get("deployment_commit") or "")'); [ "$D" = "$GITHUB_SHA" ] && exit 0; fi
            sleep 10
          done; exit 1
      - name: Build and verify expanded 68-record point-in-time payload
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m scripts.build_expanded_68_news_payload --source frozen/news-audit.json --expanded research/copper_expanded_raw_historical_news_snapshot_v1.json --output expanded-news-payload.json
          python - <<'PY'
          import json
          p=json.load(open("expanded-news-payload.json"))
          m=p.get("metadata") or {}
          assert m.get("declared_raw_input_count")==68, m
          assert m.get("original_frozen_count")==54, m
          assert m.get("independent_unique_count")==14, m
          assert m.get("point_in_time") is True, m
          assert m.get("network_refetch") is False, m
          assert m.get("date_only_session_timezone")=="Asia/Kolkata", m
          records=p.get("records") or []
          assert len(records)==m.get("transmitted_news_record_count"), (len(records),m)
          dispositions=[(r.get("news_intelligence") or {}).get("disposition") for r in records]
          assert "ALLOW" in dispositions, dispositions
          assert all(x in {"ALLOW","CONTEXT_ONLY"} for x in dispositions), dispositions
          assert dispositions.count("ALLOW")==m.get("transmitted_disposition_counts",{}).get("ALLOW"), m
          assert dispositions.count("CONTEXT_ONLY")==m.get("transmitted_disposition_counts",{}).get("CONTEXT_ONLY"), m
          print("PRE-REPLAY PAYLOAD VERIFIED:",json.dumps(m,indent=2))
          PY
      - name: Start deterministic expanded-news replay
        run: |
          curl -fsS --max-time 30 -X POST -H "X-Collector-Token: $COLLECTOR_TOKEN" -H "Content-Type: application/json" --data-binary @expanded-news-payload.json "$API_BASE/v1/internal/copper/current-mind-news-replay/start"
      - name: Wait and capture result
        run: |
          set -euo pipefail
          for i in {1..80}; do
            curl -fsS --max-time 30 -H "X-Collector-Token: $COLLECTOR_TOKEN" "$API_BASE/v1/internal/copper/current-mind-news-replay/status" -o state.json
            S=$(python -c 'import json;print(json.load(open("state.json")).get("status"))'); echo "Replay state: $S"
            if [ "$S" = "COMPLETED" ]; then python -c 'import json;d=json.load(open("state.json"));json.dump(d["result"],open("result.json","w"),indent=2)'; break; fi
            if [ "$S" = "FAILED" ]; then cat state.json; exit 1; fi; sleep 15
          done
          test -s result.json
          python - <<'PY'
          import json
          d=json.load(open("result.json"))
          assert d["scheduled_clicks"]==360 and d["evaluated_clicks"]==360 and d["click_coverage_exact"]
          assert d["data_context"]["historical_news"] is True
          m=d.get("news_metadata") or {}
          assert m.get("network_refetch") is False
          assert m.get("declared_raw_input_count")==68
          print(json.dumps({k:d.get(k) for k in ("actions","targets","stops","no_entry","session_end","expectancy_r_resolved","missed_large_moves_after_abstention","news_metadata")},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copper-current-mind-expanded-68-news-replay
          path: |
            result.json
            news-audit-v2.json
            expanded-news-payload.json
