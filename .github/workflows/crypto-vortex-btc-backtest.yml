name: BTC VORTEX v1 Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: UTC start, inclusive
        required: true
        default: '2026-06-01T00:00:00Z'
      end:
        description: UTC end, exclusive
        required: true
        default: '2026-09-01T00:00:00Z'

jobs:
  replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run 1-minute VORTEX replay
        run: python scripts/run_crypto_vortex_btc.py --start '${{ inputs.start }}' --end '${{ inputs.end }}' --interval 1m --output artifacts/vortex-btc-1m.json
      - name: Run 5-minute VORTEX replay
        run: python scripts/run_crypto_vortex_btc.py --start '${{ inputs.start }}' --end '${{ inputs.end }}' --interval 5m --output artifacts/vortex-btc-5m.json
      - name: Upload replay results
        uses: actions/upload-artifact@v4
        with:
          name: vortex-btc-results
          path: artifacts/*.json
          if-no-files-found: error
