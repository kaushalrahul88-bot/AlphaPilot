name: Crude Oil Mini Research Framework Parity

on:
  pull_request:
    paths:
      - "app/crude_oil_mini_point_in_time_context.py"
      - "app/crude_oil_mini_memory_evidence_audit.py"
      - "app/crude_oil_mini_abstention_audit.py"
      - "tests/test_crude_oil_mini_research_framework.py"
      - ".github/workflows/crude-oil-mini-research-framework-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify Crude Current Mind and Research Brain architecture
        run: |
          python -m unittest \
            tests.test_crude_oil_mini_current_mind_architecture \
            tests.test_crude_oil_mini_research_framework -v

  frozen-research-audit:
    needs: unit-parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run frozen current-contract Copper-framework parity audits
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import httpx

          from app.commodity_time import parse_ist_timestamp
          from app.crude_oil_mini_abstention_audit import evaluate_abstention_audit
          from app.crude_oil_mini_memory_evidence_audit import evaluate_memory_evidence
          from app.crude_oil_mini_point_in_time_context import acquisition_manifest, audit_context_coverage
          from app.current_mind_crude_oil_mini_replay import evaluate_crude_oil_mini_current_mind_no_news

          FROZEN_END = '2026-08-31'
          EXPECTED_CONTRACT = 'CRUDEOILM21SEP26FUT'
          api = os.environ['API_BASE'].rstrip('/')

          with httpx.Client(timeout=420) as client:
              quote_response = client.get(f'{api}/v1/quote/CRUDEOILM')
              quote_response.raise_for_status()
              quote = quote_response.json()
              candle_response = client.get(f'{api}/v1/candles/CRUDEOILM', params={'timeframe': '5m'})
              candle_response.raise_for_status()
              raw_candles = candle_response.json().get('candles') or []

          candles = [
              row for row in raw_candles
              if parse_ist_timestamp(row[0]).date().isoformat() <= FROZEN_END
          ]
          contract = quote.get('contract') or {}
          replay = evaluate_crude_oil_mini_current_mind_no_news(candles, contract)
          memory = evaluate_memory_evidence(candles, sample_every_bars=3)
          abstention = evaluate_abstention_audit(replay)

          primary_context = []
          for decision in replay.get('decisions', []):
              primary_context.append({
                  'series': 'MCX_CRUDEOILM',
                  'observed_at': decision['latest_visible_bar_start'],
                  'available_at': decision['latest_visible_bar_available_at'],
                  'source': replay['reference_contract'],
                  'value': {'price': (decision.get('features') or {}).get('price')},
                  'quality': 'OBSERVED',
              })
          coverage = audit_context_coverage(
              primary_context,
              [row['click_timestamp'] for row in replay.get('decisions', [])],
          )

          report = {
              'mode': 'CRUDE_OIL_MINI_COPPER_FRAMEWORK_PARITY_AUDIT_V1',
              'frozen_research_end': FROZEN_END,
              'reference_contract': replay['reference_contract'],
              'architecture_replicated_not_market_values': True,
              'no_news_baseline': {
                  'complete_sessions': replay['complete_sessions'],
                  'scheduled_clicks': replay['scheduled_clicks'],
                  'evaluated_clicks': replay['evaluated_clicks'],
                  'click_coverage_exact': replay['click_coverage_exact'],
                  'performance': replay['performance'],
              },
              'memory_evidence_audit': memory,
              'abstention_audit': abstention,
              'context_coverage_primary_only': coverage,
              'context_acquisition_manifest': acquisition_manifest(),
              'next_stage': 'Freeze canonical no-news Crude Research Brain before adding PIT historical Crude news to the exact same clicks.',
          }
          Path('crude-oil-mini-research-framework-parity-v1.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps({
              'mode': report['mode'],
              'reference_contract': report['reference_contract'],
              'complete_sessions': replay['complete_sessions'],
              'scheduled_clicks': replay['scheduled_clicks'],
              'memory_selected_setups': memory['selected_setups'],
              'waits': abstention['overall']['waits'],
              'large_move_candidates_after_wait': abstention['overall']['large_move_candidates'],
          }, indent=2, sort_keys=True))

          assert contract.get('trading_symbol') == EXPECTED_CONTRACT, contract
          assert replay['reference_contract'] == EXPECTED_CONTRACT, replay['reference_contract']
          assert replay['complete_sessions'] > 0, replay
          assert replay['scheduled_clicks'] == replay['complete_sessions'] * 20, replay
          assert replay['evaluated_clicks'] == replay['scheduled_clicks'], replay
          assert replay['click_coverage_exact'] is True, replay
          assert replay['news_enabled'] is False, replay
          assert replay['option_market_data_used'] is False, replay
          assert replay['integrity']['regular_crude_used'] is False, replay
          assert replay['integrity']['copper_data_used'] is False, replay
          assert all(row['required_context_complete'] for row in coverage['clicks']), coverage
          # No performance statistic is a CI gate.
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-research-framework-parity-v1
          path: crude-oil-mini-research-framework-parity-v1.json
          if-no-files-found: warn
          retention-days: 30
