name: Crude Oil Mini August Direction V2 Diagnosis

on:
  pull_request:
    paths:
      - 'app/crude_oil_mini_august_direction_v2_diagnosis.py'
      - '.github/workflows/crude-oil-mini-august-direction-v2-diagnosis.yml'
  workflow_dispatch:

jobs:
  diagnosis:
    runs-on: ubuntu-latest
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compare unchanged Direction V2 with frozen August replay
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          import httpx
          from app.crude_oil_mini_august_direction_v2_diagnosis import diagnose_direction_v2_on_frozen_august
          from app.crude_oil_pit_context_probe import probe_crude_oil_pit_context_sync

          api = os.environ['API_BASE'].rstrip('/')
          last_error = None
          for attempt in range(1, 9):
              try:
                  with httpx.Client(timeout=420) as client:
                      h = client.get(f'{api}/health', timeout=30); h.raise_for_status()
                      q = client.get(f'{api}/v1/quote/CRUDEOILM'); q.raise_for_status()
                      c = client.get(f'{api}/v1/candles/CRUDEOILM', params={'timeframe':'5m'}); c.raise_for_status()
                      quote = q.json(); candles = c.json().get('candles') or []
                  if candles:
                      break
              except Exception as exc:
                  last_error = exc
                  if attempt == 8: raise
                  time.sleep(15)
          else:
              raise RuntimeError(f'No CRUDEOILM candles returned: {last_error}')

          context = probe_crude_oil_pit_context_sync(
              '2026-06-01T00:00:00+05:30',
              '2026-09-01T00:00:00+05:30',
          )
          result = diagnose_direction_v2_on_frozen_august(candles, quote.get('contract') or {}, context)
          Path('crude-oil-mini-august-direction-v2-diagnosis.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          compact = {k:v for k,v in result.items() if k != 'enriched_decisions'}
          print(json.dumps(compact, indent=2, sort_keys=True))

          assert result['baseline']['clicks'] == 420
          assert float(result['baseline']['net_r']) == -10.0
          assert result['brain_rules_changed'] is False
          assert result['direction_v2_rules_changed'] is False
          assert result['click_schedule_changed'] is False
          assert result['fixed_horizon_direction_audit_added'] is False
          assert result['threshold_search_performed'] is False
          assert result['integrity']['future_direction_scoring_used'] is False
          assert result['integrity']['trade_geometry_used_by_v2'] is False
          assert result['integrity']['event_or_news_backfill_used'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crude-oil-mini-august-direction-v2-diagnosis
          path: crude-oil-mini-august-direction-v2-diagnosis.json
          if-no-files-found: error
          retention-days: 30
