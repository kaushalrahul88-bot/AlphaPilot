name: Copper Catch-up One-off Backfill

on:
  push:
    branches:
      - feat/commodity-brain-core-copper-catchup
    paths:
      - ".github/workflows/copper-catchup-oneoff-backfill.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copper-catchup-oneoff-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      COLLECTOR_TOKEN: ${{ secrets.COMMODITY_COLLECTOR_TOKEN }}
      EXPECTED_COMMIT: d2501cc6432c274bfc55819dbbe85c60c68d37b4
    steps:
      - name: Verify exact production deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COLLECTOR_TOKEN"
          ready=0
          for attempt in {1..10}; do
            if curl --fail --silent --show-error --max-time 30 "$API_BASE/health" -o health.json; then
              if python - <<'PY'
          import json, os
          body=json.load(open("health.json"))
          raise SystemExit(0 if body.get("deployment_commit") == os.environ["EXPECTED_COMMIT"] else 1)
          PY
              then
                ready=1
                break
              fi
            fi
            sleep $((attempt * 6))
          done
          [ "$ready" = "1" ] || { cat health.json 2>/dev/null || true; echo "Expected deploy not ready" >&2; exit 1; }

      - name: Recover Sep 1 to Sep 4 from currently active Copper contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          api=os.environ['API_BASE'].rstrip('/')
          token=os.environ['COLLECTOR_TOKEN']
          days=['2026-09-01','2026-09-02','2026-09-03','2026-09-04']
          results=[]
          for day in days:
              payload={
                  'symbol':'COPPER',
                  'start_at':f'{day}T09:00:00+05:30',
                  'end_at':f'{day}T23:30:00+05:30',
                  'timeframe_minutes':5,
              }
              p=subprocess.run([
                  'curl','--fail','--silent','--show-error','--max-time','180',
                  '-H','Content-Type: application/json',
                  '-H',f'X-Collector-Token: {token}',
                  '-X','POST',f'{api}/v1/internal/commodity-candles/backfill',
                  '-d',json.dumps(payload),
              ],capture_output=True,text=True)
              if p.returncode != 0:
                  results.append({'day':day,'curl_rc':p.returncode,'stderr':p.stderr[-500:]})
                  continue
              body=json.loads(p.stdout)
              results.append({'day':day,**body})
          summary={
              'research_only':True,
              'purpose':'RECOVER_POST_EXPIRY_COPPER_5M_FOR_PIT_REPLAY',
              'results':results,
              'total_fetched':sum(int(x.get('fetched') or 0) for x in results),
              'total_upserted':sum(int(x.get('upserted') or 0) for x in results),
              'contracts':sorted({str(x.get('contract')) for x in results if x.get('contract')}),
          }
          open('copper-sep1-sep4-recovery.json','w').write(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload recovery audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copper-sep1-sep4-recovery-${{ github.run_id }}
          path: |
            health.json
            copper-sep1-sep4-recovery.json
          if-no-files-found: warn
          retention-days: 30
