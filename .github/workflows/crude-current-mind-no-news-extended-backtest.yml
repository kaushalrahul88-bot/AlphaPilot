name: Crude Current Mind No-News Extended Backtest

on:
  pull_request:
    paths:
      - ".github/workflows/crude-current-mind-no-news-extended-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crude-current-mind-no-news-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  june-to-july:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      COLLECTOR_TOKEN: ${{ secrets.COMMODITY_COLLECTOR_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Verify frozen Current Mind code
        run: python -m unittest tests.test_current_mind_crude_no_news -v

      - name: Backfill June 1 through July 10 without changing V1
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COLLECTOR_TOKEN"
          curl --silent --show-error --max-time 20 "$API_BASE/health" >/dev/null || true
          : > crude-extended-backfill.ndjson
          rm -f crude-extended-contract.txt

          python - <<'PY' > crude-extended-ranges.txt
          from datetime import date,timedelta
          day=date(2026,6,1)
          end=date(2026,7,10)
          while day<=end:
              if day.weekday()<5:
                  print(f"{day.isoformat()}T09:00:00+05:30|{day.isoformat()}T23:30:00+05:30")
              day += timedelta(days=1)
          PY

          while IFS='|' read -r START_AT END_AT; do
            PAYLOAD=$(python - "$START_AT" "$END_AT" <<'PY'
          import json,sys
          print(json.dumps({
              "symbol":"CRUDEOIL",
              "start_at":sys.argv[1],
              "end_at":sys.argv[2],
              "timeframe_minutes":5,
          }))
          PY
            )
            SUCCESS=0
            for ATTEMPT in {1..4}; do
              CODE=$(curl --silent --show-error --max-time 180 -w "%{http_code}" \
                -H "X-Collector-Token: $COLLECTOR_TOKEN" \
                -H "Content-Type: application/json" \
                -X POST "$API_BASE/v1/internal/commodity-candles/backfill" \
                --data "$PAYLOAD" -o extended-backfill.json || echo "000")
              echo "Crude extended $START_AT attempt=$ATTEMPT HTTP=$CODE"
              if [ "$CODE" = "200" ]; then SUCCESS=1; break; fi
              cat extended-backfill.json 2>/dev/null || true
              sleep $((ATTEMPT*8))
            done
            [ "$SUCCESS" = "1" ] || { cat extended-backfill.json 2>/dev/null || true; exit 1; }
            python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open("extended-backfill.json"))
          assert d.get("status")=="BACKFILLED",d
          assert d.get("symbol")=="CRUDEOIL",d
          contract=d.get("contract")
          fetched=int(d.get("fetched") or 0)
          if fetched>0:
              assert contract,d
              p=Path("crude-extended-contract.txt")
              if p.exists():
                  assert p.read_text().strip()==contract,(p.read_text(),contract)
              else:
                  p.write_text(contract+"\n")
          with open("crude-extended-backfill.ndjson","a") as f:
              f.write(json.dumps({k:d.get(k) for k in ("start","end","contract","fetched","completed","upserted")},sort_keys=True)+"\n")
          PY
          done < crude-extended-ranges.txt
          test -s crude-extended-contract.txt

      - name: Score frozen V1 on the extended untouched period
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio,json,os
          from collections import defaultdict
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from app.crude_research_brain import read_exact_crude_contract_from_store
          from app.current_mind_crude_no_news import replay_crude_no_news_current_mind

          IST=ZoneInfo("Asia/Kolkata")
          contract=Path("crude-extended-contract.txt").read_text().strip()
          start=datetime(2026,6,1,9,0,tzinfo=IST)
          end=datetime(2026,7,10,23,30,tzinfo=IST)
          candles=asyncio.run(read_exact_crude_contract_from_store(os.environ["DATABASE_URL"],contract,start,end))
          result=replay_crude_no_news_current_mind(candles,trading_symbol=contract,clicks_per_session=20)

          monthly=defaultdict(lambda:{"clicks":0,"buy":0,"wait":0,"buy_net_pct":[]})
          for row in result["decisions"]:
              month=row["date"][:7]
              bucket=monthly[month]
              bucket["clicks"]+=1
              if row["action"]=="BUY":
                  bucket["buy"]+=1
                  bucket["buy_net_pct"].append(float(row["forward_60m_pct"])-0.04)
              else:
                  bucket["wait"]+=1
          monthly_summary={}
          for month,b in sorted(monthly.items()):
              vals=b.pop("buy_net_pct")
              wins=sum(v>0 for v in vals)
              losses=sum(v<0 for v in vals)
              gp=sum(v for v in vals if v>0)
              gl=abs(sum(v for v in vals if v<0))
              monthly_summary[month]={
                  **b,
                  "wins":wins,
                  "losses":losses,
                  "win_rate_pct":round(100*wins/len(vals),2) if vals else 0.0,
                  "avg_net_return_pct":round(sum(vals)/len(vals),4) if vals else 0.0,
                  "net_return_sum_pct":round(sum(vals),4),
                  "profit_factor":round(gp/gl,3) if gl>0 else None,
              }

          result["validation"]={
              "window_start":start.isoformat(),
              "window_end":end.isoformat(),
              "window_used_to_define_v1":False,
              "v1_changed_after_july_validation":False,
              "validation_type":"EXTENDED_INDEPENDENT_EARLIER_HISTORICAL_BACKTEST",
              "news_enabled":False,
          }
          result["monthly_summary"]=monthly_summary
          Path("crude-current-mind-no-news-v1-extended.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "current_mind_id":result["current_mind_id"],
              "contract":contract,
              "validation":result["validation"],
              "coverage":result["coverage"],
              "actions":result["actions"],
              "score":result["score"],
              "monthly_summary":monthly_summary,
          },indent=2,sort_keys=True))
          assert result["news_enabled"] is False
          assert result["coverage"]["exact_click_coverage"] is True
          assert result["coverage"]["parity_mismatches"]==0
          assert result["coverage"]["scheduled_clicks"]>=300
          assert result["validation"]["v1_changed_after_july_validation"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-current-mind-no-news-v1-extended
          path: |
            crude-current-mind-no-news-v1-extended.json
            crude-extended-backfill.ndjson
          if-no-files-found: warn
          retention-days: 30
