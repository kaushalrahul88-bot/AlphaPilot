name: Crude Current Mind No-News Independent Backtest

on:
  pull_request:
    paths:
      - ".github/workflows/crude-current-mind-no-news-independent-backtest.yml"
      - "app/current_mind_crude_no_news.py"
      - "app/crude_random_click_replay.py"
      - "app/crude_directional_asymmetry_candidate.py"
      - "app/crude_research_brain.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crude-current-mind-no-news-independent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-july:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      COLLECTOR_TOKEN: ${{ secrets.COMMODITY_COLLECTOR_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Verify frozen no-news Current Mind tests
        run: |
          python -m unittest \
            tests.test_crude_research_brain \
            tests.test_crude_directional_asymmetry_candidate \
            tests.test_current_mind_crude_no_news -v

      - name: Backfill untouched July 13-31 exact-contract sessions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COLLECTOR_TOKEN"
          curl --silent --show-error --max-time 20 "$API_BASE/health" >/dev/null || true
          : > crude-july-backfill.ndjson
          rm -f crude-july-contract.txt

          python - <<'PY' > crude-july-ranges.txt
          from datetime import date,timedelta
          day=date(2026,7,13)
          end=date(2026,7,31)
          while day<=end:
              if day.weekday()<5:
                  print(f"{day.isoformat()}T09:00:00+05:30|{day.isoformat()}T23:30:00+05:30")
              day += timedelta(days=1)
          PY

          while IFS='|' read -r START_AT END_AT; do
            PAYLOAD=$(python - "$START_AT" "$END_AT" <<'PY'
          import json,sys
          print(json.dumps({
              "symbol":"CRUDEOIL",
              "start_at":sys.argv[1],
              "end_at":sys.argv[2],
              "timeframe_minutes":5,
          }))
          PY
            )
            SUCCESS=0
            for ATTEMPT in {1..4}; do
              CODE=$(curl --silent --show-error --max-time 180 -w "%{http_code}" \
                -H "X-Collector-Token: $COLLECTOR_TOKEN" \
                -H "Content-Type: application/json" \
                -X POST "$API_BASE/v1/internal/commodity-candles/backfill" \
                --data "$PAYLOAD" -o july-backfill.json || echo "000")
              echo "Crude July $START_AT attempt=$ATTEMPT HTTP=$CODE"
              if [ "$CODE" = "200" ]; then SUCCESS=1; break; fi
              cat july-backfill.json 2>/dev/null || true
              sleep $((ATTEMPT*8))
            done
            [ "$SUCCESS" = "1" ] || { cat july-backfill.json 2>/dev/null || true; exit 1; }
            python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open("july-backfill.json"))
          assert d.get("status")=="BACKFILLED",d
          assert d.get("symbol")=="CRUDEOIL",d
          assert d.get("timeframe_minutes")==5,d
          contract=d.get("contract")
          fetched=int(d.get("fetched") or 0)
          if fetched>0:
              assert contract,d
              p=Path("crude-july-contract.txt")
              if p.exists():
                  assert p.read_text().strip()==contract,(p.read_text(),contract)
              else:
                  p.write_text(contract+"\n")
          with open("crude-july-backfill.ndjson","a") as f:
              f.write(json.dumps({k:d.get(k) for k in ("start","end","contract","fetched","completed","upserted")},sort_keys=True)+"\n")
          PY
          done < crude-july-ranges.txt

          test -s crude-july-contract.txt
          echo "Frozen Current Mind July contract: $(cat crude-july-contract.txt)"

      - name: Backtest frozen Current Mind without news
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python - <<'PY'
          import asyncio,json,os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from app.crude_research_brain import read_exact_crude_contract_from_store
          from app.current_mind_crude_no_news import replay_crude_no_news_current_mind

          IST=ZoneInfo("Asia/Kolkata")
          contract=Path("crude-july-contract.txt").read_text().strip()
          start=datetime(2026,7,13,9,0,tzinfo=IST)
          end=datetime(2026,7,31,23,30,tzinfo=IST)
          candles=asyncio.run(read_exact_crude_contract_from_store(
              os.environ["DATABASE_URL"],contract,start,end
          ))
          result=replay_crude_no_news_current_mind(
              candles,trading_symbol=contract,clicks_per_session=20
          )
          result["validation"]={
              "window_start":start.isoformat(),
              "window_end":end.isoformat(),
              "window_used_to_define_v1":False,
              "v1_frozen_before_window_outcomes_inspected":True,
              "validation_type":"INDEPENDENT_EARLIER_HISTORICAL_BACKTEST",
              "news_enabled":False,
          }
          Path("crude-current-mind-no-news-v1-july.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps({
              "mode":result["mode"],
              "current_mind_id":result["current_mind_id"],
              "contract":contract,
              "validation":result["validation"],
              "coverage":result["coverage"],
              "actions":result["actions"],
              "score":result["score"],
              "freeze_candidate":result["freeze_candidate"],
          },indent=2,sort_keys=True))
          assert result["news_enabled"] is False
          assert result["current_mind_id"]=="CRUDE_CURRENT_MIND_NO_NEWS_V1"
          assert result["validation"]["window_used_to_define_v1"] is False
          assert result["validation"]["v1_frozen_before_window_outcomes_inspected"] is True
          assert result["coverage"]["exact_click_coverage"] is True
          assert result["coverage"]["parity_mismatches"]==0
          assert result["coverage"]["scheduled_clicks"]>=200
          assert result["coverage"]["scheduled_clicks"]%20==0
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-current-mind-no-news-v1-independent-july
          path: |
            crude-current-mind-no-news-v1-july.json
            crude-july-backfill.ndjson
          if-no-files-found: warn
          retention-days: 30
