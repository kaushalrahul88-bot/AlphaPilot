name: Copper Memory Evidence Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      COLLECTOR_TOKEN: ${{ secrets.COMMODITY_COLLECTOR_TOKEN }}
    steps:
      - name: Wait for endpoint
        run: |
          set -euo pipefail
          for i in {1..36}; do
            if curl -fsS --max-time 20 "$API_BASE/openapi.json" -o o.json && python -c 'import json,sys;d=json.load(open("o.json"));sys.exit(0 if "/v1/internal/copper/memory-evidence-audit" in d.get("paths",{}) else 1)'; then sleep 20; exit 0; fi
            sleep 10
          done
          exit 1
      - name: Run evidence audit
        run: |
          set -euo pipefail
          curl -fsS --max-time 300 -H "X-Collector-Token: $COLLECTOR_TOKEN" "$API_BASE/v1/internal/copper/memory-evidence-audit?sample_every_bars=3&analogue_k=75" -o result.json
          python - <<'PY'
          import json
          d=json.load(open("result.json"))
          assert d["mode"]=="COPPER_MEMORY_EVIDENCE_AUDIT_V1" and d["production_rules_changed"] is False
          print(json.dumps({k:d.get(k) for k in ("setups","resolved","target_first","target_first_pct_resolved","BUY_CE","SELL_PE","selection_rule")},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: copper-memory-evidence-audit, path: result.json}
