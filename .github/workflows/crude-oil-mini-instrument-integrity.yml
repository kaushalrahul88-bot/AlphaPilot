name: Crude Oil Mini Instrument Integrity

on:
  pull_request:
    paths:
      - "app/crude_oil_mini_contracts.py"
      - "tests/test_crude_oil_mini_contracts.py"
      - ".github/workflows/crude-oil-mini-instrument-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify Mini/regular-Crude separation
        run: python -m unittest tests.test_crude_oil_mini_contracts -v
      - name: Probe current Groww CRUDEOILM universe
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          from app.crude_oil_mini_contracts import CRUDE_OIL_MINI, audit_current_crude_oil_mini_universe

          result = asyncio.run(audit_current_crude_oil_mini_universe())
          Path("crude-oil-mini-instrument-integrity.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(result, indent=2, sort_keys=True))

          assert result["status"] == "READY", result
          assert result["underlying_symbol"] == CRUDE_OIL_MINI, result
          assert result["future"]["underlying"] == CRUDE_OIL_MINI, result
          assert result["future"]["instrument_type"] == "FUT", result
          assert result["nearest_option_types"] == ["CE", "PE"], result
          assert result["instrument_master_rows"] > 0, result
          assert result["regular_crude_alias_allowed"] is False, result
          assert result["future_and_option_expiry_are_independent"] is True, result
          assert result["live_execution_enabled"] is False, result
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-instrument-integrity
          path: crude-oil-mini-instrument-integrity.json
          if-no-files-found: warn
          retention-days: 30
