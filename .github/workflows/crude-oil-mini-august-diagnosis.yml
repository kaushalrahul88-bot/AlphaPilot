name: Crude Oil Mini August Frozen Diagnosis

on:
  pull_request:
    paths:
      - "app/crude_oil_mini_august_diagnosis.py"
      - ".github/workflows/crude-oil-mini-august-diagnosis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Diagnose exact frozen August replay
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          import httpx
          from app.crude_oil_mini_august_diagnosis import diagnose_frozen_august_replay

          api = os.environ['API_BASE'].rstrip('/')
          last_error = None
          for attempt in range(1, 9):
              try:
                  with httpx.Client(timeout=420) as client:
                      h = client.get(f'{api}/health', timeout=30); h.raise_for_status()
                      q = client.get(f'{api}/v1/quote/CRUDEOILM'); q.raise_for_status()
                      c = client.get(f'{api}/v1/candles/CRUDEOILM', params={'timeframe':'5m'}); c.raise_for_status()
                      quote = q.json(); candles = c.json().get('candles') or []
                  if candles:
                      break
              except Exception as exc:
                  last_error = exc
                  if attempt == 8: raise
                  time.sleep(15)
          else:
              raise RuntimeError(f'No CRUDEOILM candles returned: {last_error}')

          result = diagnose_frozen_august_replay(candles, quote.get('contract') or {})
          Path('crude-oil-mini-august-frozen-diagnosis.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          compact = {k:v for k,v in result.items() if k != 'enriched_decisions'}
          print(json.dumps(compact, indent=2, sort_keys=True))
          assert result['baseline']['clicks'] == 420
          assert float(result['baseline']['net_r']) == -10.0
          assert result['brain_rules_changed'] is False
          assert result['click_schedule_changed'] is False
          assert result['integrity']['direction_audit_added'] is False
          assert result['integrity']['threshold_search_performed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-august-frozen-diagnosis
          path: crude-oil-mini-august-frozen-diagnosis.json
          if-no-files-found: error
          retention-days: 30
