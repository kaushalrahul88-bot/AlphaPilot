name: F&O V6 Historical Holdout B Evaluator

on:
  pull_request:
    paths:
      - 'app/fno_market_brain_v6_holdout_b_evaluation.py'
      - 'tests/test_fno_market_brain_v6_holdout_b_evaluation.py'
      - 'docs/fno_market_brain_v6_holdout_b_evaluator_freeze.md'
      - '.github/workflows/fno-v6-historical-holdout-b-evaluator.yml'
  push:
    branches: [main]
    paths:
      - 'app/fno_market_brain_v6_holdout_b_evaluation.py'
      - 'tests/test_fno_market_brain_v6_holdout_b_evaluation.py'
      - 'docs/fno_market_brain_v6_holdout_b_evaluator_freeze.md'
      - '.github/workflows/fno-v6-historical-holdout-b-evaluator.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_fno_market_brain_v6_holdout_b_evaluation.py tests/test_fno_market_brain_v6.py tests/test_fno_market_brain_v6_holdout_b_dataset.py
      - run: python -m py_compile app/fno_market_brain_v6_holdout_b_evaluation.py
