name: Crude Oil Mini Current Mind No-News Architecture V1

on:
  pull_request:
    paths:
      - "app/crude_oil_mini_market_perception.py"
      - "app/crude_oil_mini_experience_memory.py"
      - "app/crude_oil_mini_information_board.py"
      - "app/crude_oil_mini_current_mind.py"
      - "app/current_mind_crude_oil_mini_replay.py"
      - "tests/test_crude_oil_mini_current_mind_architecture.py"
      - ".github/workflows/crude-oil-mini-current-mind-no-news.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Verify Current Mind architecture and point-in-time integrity
        run: python -m unittest tests.test_crude_oil_mini_current_mind_architecture -v

      - name: Run current-expiry Crude Oil Mini no-news replay
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import httpx
          from app.current_mind_crude_oil_mini_replay import evaluate_crude_oil_mini_current_mind_no_news

          api=os.environ['API_BASE'].rstrip('/')
          with httpx.Client(timeout=420) as client:
              quote_response=client.get(f'{api}/v1/quote/CRUDEOILM')
              quote_response.raise_for_status()
              quote=quote_response.json()
              candle_response=client.get(f'{api}/v1/candles/CRUDEOILM',params={'timeframe':'5m'})
              candle_response.raise_for_status()
              candles=(candle_response.json().get('candles') or [])

          contract=quote.get('contract') or {}
          result=evaluate_crude_oil_mini_current_mind_no_news(candles,contract)
          Path('crude-oil-mini-current-mind-no-news-v1.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'mode':result['mode'],
              'reference_contract':result['reference_contract'],
              'candles':result['candles'],
              'complete_sessions':result['complete_sessions'],
              'scheduled_clicks':result['scheduled_clicks'],
              'evaluated_clicks':result['evaluated_clicks'],
              'click_coverage_exact':result['click_coverage_exact'],
              'performance':result['performance'],
              'architecture':result['architecture'],
              'integrity':result['integrity'],
          },indent=2,sort_keys=True))

          assert contract.get('trading_symbol')=='CRUDEOILM21SEP26FUT',contract
          assert contract.get('lot_size')==10,contract
          assert result['reference_contract']=='CRUDEOILM21SEP26FUT',result['reference_contract']
          assert result['complete_sessions']>0,result
          assert result['scheduled_clicks']==result['complete_sessions']*20,result
          assert result['evaluated_clicks']==result['scheduled_clicks'],result
          assert result['click_coverage_exact'] is True,result
          assert result['news_enabled'] is False,result
          assert result['option_market_data_used'] is False,result
          assert result['integrity']['regular_crude_used'] is False,result
          assert result['integrity']['copper_data_used'] is False,result
          assert result['integrity']['future_bars_used_only_after_decision_freeze'] is True,result
          # Performance is descriptive. It is deliberately not a CI pass/fail gate.
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-current-mind-no-news-architecture-v1
          path: crude-oil-mini-current-mind-no-news-v1.json
          if-no-files-found: warn
          retention-days: 30
