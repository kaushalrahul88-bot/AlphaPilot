name: Crude Mini Current Mind Live Shadow

on:
  push:
    branches:
      - main
    paths:
      - "app/crude_oil_mini_live_click.py"
      - ".github/workflows/crude-mini-current-mind-live-shadow.yml"
  workflow_dispatch:
  schedule:
    # MCX regular weekday window in IST, aligned to 15-minute slots.
    # 03:30 UTC = 09:00 IST; 18:00 UTC = 23:30 IST.
    - cron: "30,45 3 * * 1-5"
    - cron: "*/15 4-17 * * 1-5"
    - cron: "0 18 * * 1-5"

permissions:
  contents: read

concurrency:
  group: crude-mini-current-mind-live-shadow
  cancel-in-progress: false

jobs:
  live-shadow-click:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run one scheduled point-in-time live shadow click
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import httpx

          from app.commodities import mcx_session_status
          from app.crude_oil_mini_live_click import evaluate_live_current_mind
          from app.crude_oil_pit_context_probe import probe_crude_oil_pit_context_sync

          IST = ZoneInfo("Asia/Kolkata")
          api = os.environ["API_BASE"].rstrip("/")
          now = datetime.now(IST)
          click = now.replace(minute=(now.minute // 15) * 15, second=0, microsecond=0)
          output = Path("crude-mini-current-mind-live-shadow.json")
          session = mcx_session_status(click)

          if not session.get("is_open"):
              skipped = {
                  "mode": "CRUDE_OIL_MINI_CURRENT_MIND_LIVE_SHADOW_V1",
                  "generated_at": now.isoformat(),
                  "click_at": click.isoformat(),
                  "point_in_time": True,
                  "status": "SKIPPED_MARKET_CLOSED",
                  "market_session": session,
                  "execution": {
                      "paper_signal_only": True,
                      "live_execution_enabled": False,
                      "broker_order_placement_enabled": False,
                      "capital_committed": 0,
                  },
              }
              output.write_text(json.dumps(skipped, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print(json.dumps(skipped, indent=2, sort_keys=True))
              sys.exit(0)

          with httpx.Client(timeout=420, follow_redirects=True) as client:
              health = client.get(f"{api}/health", timeout=60)
              health.raise_for_status()
              q = client.get(f"{api}/v1/quote/CRUDEOILM")
              q.raise_for_status()
              quote = q.json()
              c = client.get(f"{api}/v1/candles/CRUDEOILM", params={"timeframe": "5m"})
              c.raise_for_status()
              candles = c.json().get("candles") or []

          context = probe_crude_oil_pit_context_sync(
              start=(click - timedelta(days=7)).isoformat(),
              end=(click + timedelta(minutes=5)).isoformat(),
          )
          result = evaluate_live_current_mind(
              candles,
              contract=(quote.get("contract") or {}),
              global_context_probe=context,
              click_at=click,
          )
          result["market_session"] = session
          result["scheduled_slot"] = click.isoformat()
          output.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          compact = {
              "click_at": result["click_at"],
              "scheduled_slot": result["scheduled_slot"],
              "reference_contract": result["reference_contract"],
              "latest_completed_bar_available_at": result["latest_completed_bar_available_at"],
              "current_mind": result["current_mind"],
              "integrated_v2_shadow": {
                  k: result["integrated_v2_shadow"][k]
                  for k in ("direction", "confidence", "thesis_state", "supporting_families", "opposing_families", "decision_effect")
              },
              "data": result["data"],
              "execution": result["execution"],
          }
          print(json.dumps(compact, indent=2, sort_keys=True))
          assert result["point_in_time"] is True
          assert result["click_at"] == click.isoformat()
          assert result["execution"]["paper_signal_only"] is True
          assert result["execution"]["live_execution_enabled"] is False
          assert result["execution"]["broker_order_placement_enabled"] is False
          assert result["execution"]["capital_committed"] == 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-mini-current-mind-live-shadow-${{ github.run_id }}
          path: crude-mini-current-mind-live-shadow.json
          if-no-files-found: warn
          retention-days: 30
