name: Crude Mini Current Mind Live Shadow

on:
  push:
    branches:
      - main
    paths:
      - "app/crude_oil_mini_live_click.py"
      - "app/crude_oil_mini_live_inputs.py"
      - "app/crude_oil_mini_participation_v2.py"
      - "app/crude_oil_mini_direction_brain_v2_integrated.py"
      - ".github/workflows/crude-mini-current-mind-live-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crude-mini-current-mind-live-shadow
  cancel-in-progress: false

jobs:
  live-shadow-click:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      COLLECTOR_TOKEN: ${{ secrets.COMMODITY_COLLECTOR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run one scheduled point-in-time live shadow click
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import httpx

          from app.commodities import mcx_session_status
          from app.crude_oil_mini_live_click import evaluate_live_current_mind
          from app.crude_oil_pit_context_probe import probe_crude_oil_pit_context_sync

          IST = ZoneInfo("Asia/Kolkata")
          api = os.environ["API_BASE"].rstrip("/")
          collector_token = os.environ.get("COLLECTOR_TOKEN", "").strip()
          now = datetime.now(IST)
          click = now.replace(minute=(now.minute // 15) * 15, second=0, microsecond=0)
          output = Path("crude-mini-current-mind-live-shadow.json")
          session = mcx_session_status(click)

          SAFE_EXECUTION = {
              "paper_signal_only": True,
              "live_execution_enabled": False,
              "broker_order_placement_enabled": False,
              "capital_committed": 0,
          }

          def write_and_exit(payload, code=0):
              output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print(json.dumps(payload, indent=2, sort_keys=True))
              raise SystemExit(code)

          if not session.get("is_open"):
              write_and_exit({
                  "mode": "CRUDE_OIL_MINI_CURRENT_MIND_LIVE_SHADOW_V2_OPTION_OI_NEWS",
                  "generated_at": now.isoformat(),
                  "click_at": click.isoformat(),
                  "scheduled_slot": click.isoformat(),
                  "point_in_time": True,
                  "status": "SKIPPED_MARKET_CLOSED",
                  "market_session": session,
                  "execution": SAFE_EXECUTION,
              })

          def get_json(client, path, *, params=None, headers=None, timeout=90, attempts=5):
              errors = []
              for attempt in range(1, attempts + 1):
                  try:
                      response = client.get(
                          f"{api}{path}", params=params, headers=headers, timeout=timeout
                      )
                      response.raise_for_status()
                      return response.json(), errors
                  except Exception as exc:
                      errors.append(f"attempt {attempt}: {exc.__class__.__name__}: {str(exc)[:220]}")
                      if attempt < attempts:
                          time.sleep(min(5 * attempt, 20))
              raise RuntimeError(" | ".join(errors))

          try:
              with httpx.Client(timeout=120, follow_redirects=True) as client:
                  _, health_errors = get_json(client, "/health", timeout=60, attempts=3)
                  quote, quote_errors = get_json(client, "/v1/quote/CRUDEOILM", attempts=5)
                  candle_body, candle_errors = get_json(
                      client,
                      "/v1/candles/CRUDEOILM",
                      params={"timeframe": "5m"},
                      attempts=5,
                  )
                  candles = candle_body.get("candles") or []
              if not candles:
                  raise RuntimeError("Live CRUDEOILM candle endpoint returned no candles")
          except Exception as exc:
              write_and_exit({
                  "mode": "CRUDE_OIL_MINI_CURRENT_MIND_LIVE_SHADOW_V2_OPTION_OI_NEWS",
                  "generated_at": datetime.now(IST).isoformat(),
                  "click_at": click.isoformat(),
                  "scheduled_slot": click.isoformat(),
                  "point_in_time": True,
                  "status": "DATA_ERROR",
                  "reason": f"{exc.__class__.__name__}: {str(exc)[:1200]}",
                  "market_session": session,
                  "execution": SAFE_EXECUTION,
              })

          live_inputs = {
              "as_of": click.isoformat(),
              "point_in_time": True,
              "option_positioning": {
                  "status": "UNAVAILABLE",
                  "reason": "PIT_LIVE_INPUT_ENDPOINT_UNAVAILABLE",
                  "futures_oi_required": False,
              },
              "news": {
                  "status": "UNAVAILABLE",
                  "visible_count": 0,
                  "transmitted_count": 0,
                  "event_records": [],
                  "pit_basis": "FIRST_DETECTED_AT",
              },
          }
          live_input_errors = []
          if collector_token:
              try:
                  with httpx.Client(timeout=120, follow_redirects=True) as client:
                      live_inputs, live_input_errors = get_json(
                          client,
                          "/v1/internal/crude-oil-mini/live-inputs",
                          params={"as_of": click.isoformat()},
                          headers={"X-Collector-Token": collector_token},
                          attempts=3,
                      )
              except Exception as exc:
                  live_input_errors.append(
                      f"final: {exc.__class__.__name__}: {str(exc)[:600]}"
                  )
          else:
              live_input_errors.append("COMMODITY_COLLECTOR_TOKEN is not configured")

          try:
              context = probe_crude_oil_pit_context_sync(
                  start=(click - timedelta(days=7)).isoformat(),
                  end=(click + timedelta(minutes=5)).isoformat(),
              )
              result = evaluate_live_current_mind(
                  candles,
                  contract=(quote.get("contract") or {}),
                  global_context_probe=context,
                  live_inputs=live_inputs,
                  click_at=click,
                  scheduled_slot_at=click,
              )
              result["market_session"] = session
              result["scheduled_slot"] = click.isoformat()
              result["transport_retries"] = {
                  "health": health_errors,
                  "quote": quote_errors,
                  "candles": candle_errors,
                  "pit_live_inputs": live_input_errors,
              }
              output.write_text(
                  json.dumps(result, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              compact = {
                  "click_at": result["click_at"],
                  "scheduled_slot": result["scheduled_slot"],
                  "reference_contract": result["reference_contract"],
                  "latest_completed_bar_available_at": result["latest_completed_bar_available_at"],
                  "current_mind": result["current_mind"],
                  "integrated_v2_shadow": {
                      k: result["integrated_v2_shadow"][k]
                      for k in ("direction", "confidence", "thesis_state", "supporting_families", "opposing_families", "decision_effect")
                  },
                  "option_positioning": result["data"]["option_positioning"],
                  "news": result["data"]["news"],
                  "global_context": result["data"]["global_context"],
                  "transport_retries": result["transport_retries"],
                  "execution": result["execution"],
              }
              print(json.dumps(compact, indent=2, sort_keys=True))
              assert result["point_in_time"] is True
              assert result["click_at"] == click.isoformat()
              assert result["trade_instrument"] == "OPTIONS_ONLY"
              assert result["data"]["futures_oi"].startswith("OPTIONAL")
              assert result["execution"]["paper_signal_only"] is True
              assert result["execution"]["live_execution_enabled"] is False
              assert result["execution"]["broker_order_placement_enabled"] is False
              assert result["execution"]["capital_committed"] == 0
          except Exception as exc:
              write_and_exit({
                  "mode": "CRUDE_OIL_MINI_CURRENT_MIND_LIVE_SHADOW_V2_OPTION_OI_NEWS",
                  "generated_at": datetime.now(IST).isoformat(),
                  "click_at": click.isoformat(),
                  "scheduled_slot": click.isoformat(),
                  "point_in_time": True,
                  "status": "EVALUATION_ERROR",
                  "reason": f"{exc.__class__.__name__}: {str(exc)[:1200]}",
                  "market_session": session,
                  "execution": SAFE_EXECUTION,
              })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-mini-current-mind-live-shadow-${{ github.run_id }}
          path: crude-mini-current-mind-live-shadow.json
          if-no-files-found: error
          retention-days: 30
