name: Crude Current Mind No-News Parity

on:
  pull_request:
    paths:
      - "app/current_mind_crude_no_news.py"
      - "tests/test_current_mind_crude_no_news.py"
      - ".github/workflows/crude-current-mind-no-news-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_current_mind_crude_no_news -v

      - name: Replay frozen Current Mind on the same 420-click schedule
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python - <<'PY'
          import asyncio,json,os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import psycopg

          from app.crude_research_brain import read_exact_crude_contract_from_store
          from app.current_mind_crude_no_news import replay_crude_no_news_current_mind

          IST=ZoneInfo("Asia/Kolkata")
          start=datetime(2026,8,3,9,0,tzinfo=IST)
          end=datetime(2026,8,31,23,30,tzinfo=IST)
          with psycopg.connect(os.environ["DATABASE_URL"],connect_timeout=10) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("""
                      SELECT trading_symbol,COUNT(*) n FROM commodity_candles
                      WHERE provider='GROWW' AND symbol='CRUDEOIL' AND timeframe_minutes=5
                        AND candle_at >= %s AND candle_at <= %s
                      GROUP BY trading_symbol ORDER BY n DESC,trading_symbol ASC LIMIT 1
                  """,(start,end))
                  row=cursor.fetchone()
          assert row and row[0],"No exact Crude contract data available"
          contract,count=row
          candles=asyncio.run(read_exact_crude_contract_from_store(os.environ["DATABASE_URL"],contract,start,end))
          result=replay_crude_no_news_current_mind(candles,trading_symbol=contract,clicks_per_session=20)
          result["contract_selection"]={"method":"MOST_COMPLETE_EXACT_CONTRACT_IN_REPLAY_WINDOW","trading_symbol":contract,"stored_rows":count}
          Path("crude-current-mind-no-news-v1-parity.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "mode":result["mode"],
              "current_mind_id":result["current_mind_id"],
              "contract":contract,
              "coverage":result["coverage"],
              "actions":result["actions"],
              "score":result["score"],
              "freeze_candidate":result["freeze_candidate"],
              "next_gate":result["next_gate"],
          },indent=2,sort_keys=True))
          assert result["news_enabled"] is False
          assert result["parity_audit_only"] is True
          assert result["new_strategy_evidence_claimed"] is False
          assert result["coverage"]["scheduled_clicks"]==420
          assert result["coverage"]["evaluated_clicks"]==420
          assert result["coverage"]["exact_click_coverage"] is True
          assert result["coverage"]["parity_mismatches"]==0
          assert result["actions"].get("BUY",0)==83
          assert result["actions"].get("WAIT",0)==337
          assert result["freeze_candidate"]["ready"] is True
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-current-mind-no-news-v1-parity
          path: crude-current-mind-no-news-v1-parity.json
          if-no-files-found: warn
          retention-days: 30
