name: Copper Current Mind Frozen News Comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      COLLECTOR_TOKEN: ${{ secrets.COMMODITY_COLLECTOR_TOKEN }}
      SOURCE_ARTIFACT_ID: "9731584724"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:\n          python-version: "3.12"\n          cache: pip
      - run: pip install -r requirements.txt
      - name: Download frozen source and re-audit locally
        env:\n          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > source.zip
          unzip -q source.zip -d frozen
          PYTHONPATH=. python -m scripts.reaudit_frozen_copper_news --source frozen/news-audit.json --output news-audit-v2.json
      - name: Wait for exact Render commit
        run: |
          set -euo pipefail; test -n "$COLLECTOR_TOKEN"
          for i in {1..75}; do
            if curl -fsS --max-time 20 "$API_BASE/health" -o h.json; then D=$(python -c 'import json;print(json.load(open("h.json")).get("deployment_commit") or "")'); [ "$D" = "$GITHUB_SHA" ] && exit 0; fi
            sleep 10
          done; exit 1
      - name: Build frozen News Intelligence payload
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from app.copper_news_intelligence import apply_news_intelligence
          d=json.load(open("news-audit-v2.json"))
          records=[{
            "series":"COPPER_NEWS","observed_at":x["available_at"],"available_at":x["available_at"],
            "source":x.get("source") or "GDELT",
            "value":{"headline":x["headline"],"sentiment":x.get("raw_sentiment"),"url":x.get("url")},
            "quality":"FROZEN_INTEGRITY_AUDIT_ACCEPTED",
          } for x in d.get("accepted",[])]
          intel=apply_news_intelligence(records); allowed=intel["allowed_records"]
          assert len(allowed)==1 and "congo" in allowed[0]["value"]["headline"].lower()
          payload={"records":allowed,"metadata":{
            "source_dataset_sha256":(d.get("source_metadata") or {}).get("source_dataset_sha256"),
            "accepted_dataset_sha256":d.get("accepted_dataset_sha256"),
            "integrity_classification_counts":d.get("classification_counts"),
            "news_intelligence_counts":intel.get("counts"),
            "news_intelligence_policy":intel.get("policy"),
            "allowed_headlines":[x["value"]["headline"] for x in allowed],
          }}
          json.dump(payload,open("frozen-news-payload.json","w"),indent=2)
          PY
      - name: Start deterministic frozen-news replay
        run: |
          curl -fsS --max-time 30 -X POST -H "X-Collector-Token: $COLLECTOR_TOKEN" -H "Content-Type: application/json" --data-binary @frozen-news-payload.json "$API_BASE/v1/internal/copper/current-mind-news-replay/start"
      - name: Wait and capture result
        run: |
          set -euo pipefail
          for i in {1..80}; do
            curl -fsS --max-time 30 -H "X-Collector-Token: $COLLECTOR_TOKEN" "$API_BASE/v1/internal/copper/current-mind-news-replay/status" -o state.json
            S=$(python -c 'import json;print(json.load(open("state.json")).get("status"))'); echo "Replay state: $S"
            if [ "$S" = "COMPLETED" ]; then python -c 'import json;d=json.load(open("state.json"));json.dump(d["result"],open("result.json","w"),indent=2)'; break; fi
            if [ "$S" = "FAILED" ]; then cat state.json; exit 1; fi; sleep 15
          done
          test -s result.json
          python - <<'PY'
          import json
          d=json.load(open("result.json"))
          assert d["scheduled_clicks"]==360 and d["evaluated_clicks"]==360 and d["click_coverage_exact"]
          assert d["data_context"]["historical_news"] is True
          m=d.get("news_metadata") or {}
          assert m.get("network_refetch") is False
          assert len(m.get("allowed_headlines") or [])==1
          print(json.dumps({k:d.get(k) for k in ("actions","targets","stops","no_entry","session_end","expectancy_r_resolved","missed_large_moves_after_abstention","news_metadata")},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copper-current-mind-frozen-news-comparison
          path: |
            result.json
            news-audit-v2.json
            frozen-news-payload.json
