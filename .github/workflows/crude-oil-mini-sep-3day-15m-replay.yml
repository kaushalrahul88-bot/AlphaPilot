name: Crude Oil Mini 3-Day 15m Replay

on:
  push:
    branches:
      - crude-mini-sep-3day-15m-replay-v1
    paths:
      - "app/crude_oil_mini_sep_3day_15m_replay.py"
      - "tests/test_crude_oil_mini_sep_3day_15m_replay.py"
      - ".github/workflows/crude-oil-mini-sep-3day-15m-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-day-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      COLLECTOR_TOKEN: ${{ secrets.COMMODITY_COLLECTOR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Verify replay contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest tests.test_crude_oil_mini_sep_3day_15m_replay -v

      - name: Run frozen 147-click replay
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          import httpx

          from app.crude_oil_mini_sep_3day_15m_replay import evaluate_three_day_15m_replay
          from app.crude_oil_pit_context_probe import probe_crude_oil_pit_context_sync

          api = os.environ["API_BASE"].rstrip("/")
          collector_token = str(os.environ.get("COLLECTOR_TOKEN") or "").strip()

          last_error = None
          quote = None
          candles = None
          option_readiness = None
          for attempt in range(1, 9):
              try:
                  with httpx.Client(timeout=420, follow_redirects=True) as client:
                      health = client.get(f"{api}/health", timeout=30)
                      health.raise_for_status()
                      q = client.get(f"{api}/v1/quote/CRUDEOILM")
                      q.raise_for_status()
                      quote = q.json()
                      c = client.get(f"{api}/v1/candles/CRUDEOILM", params={"timeframe": "5m"})
                      c.raise_for_status()
                      candles = c.json().get("candles") or []
                      if collector_token:
                          try:
                              readiness = client.get(
                                  f"{api}/v1/internal/commodity-options/snapshot-readiness",
                                  params={"symbol": "CRUDEOILM", "days": 10},
                                  headers={"X-Collector-Token": collector_token},
                                  timeout=60,
                              )
                              readiness.raise_for_status()
                              option_readiness = readiness.json()
                          except Exception as readiness_exc:
                              print(f"Option readiness unavailable without failing replay: {readiness_exc}")
                              option_readiness = None
                  if candles:
                      break
              except Exception as exc:
                  last_error = exc
                  if attempt == 8:
                      raise
                  time.sleep(15)
          else:
              raise RuntimeError(f"No CRUDEOILM candles returned: {last_error}")

          context_probe = None
          context_error = None
          for attempt in range(1, 6):
              try:
                  context_probe = probe_crude_oil_pit_context_sync(
                      start="2026-08-27T00:00:00+05:30",
                      end="2026-09-03T00:00:00+05:30",
                  )
                  required = [
                      name
                      for name in ("WTI_CRUDE", "BRENT_CRUDE")
                      if ((context_probe.get("feeds") or {}).get(name) or {}).get("status") != "AVAILABLE"
                  ]
                  if not required:
                      break
                  context_error = RuntimeError(f"Required context unavailable: {required}")
              except Exception as exc:
                  context_error = exc
              if attempt < 5:
                  time.sleep(10)
          if context_probe is None or context_error and any(
              ((context_probe.get("feeds") or {}).get(name) or {}).get("status") != "AVAILABLE"
              for name in ("WTI_CRUDE", "BRENT_CRUDE")
          ):
              raise RuntimeError(f"Could not establish required WTI/Brent PIT context: {context_error}")

          contract = (quote or {}).get("contract") or {}
          result = evaluate_three_day_15m_replay(
              candles,
              contract=contract,
              global_context_probe=context_probe,
              option_readiness=option_readiness,
          )
          output = Path("crude-oil-mini-sep-3day-15m-replay.json")
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          compact = {
              "reference_contract": result["reference_contract"],
              "manifest": {k: v for k, v in result["manifest"].items() if k != "clicks"},
              "daily": result["daily"],
              "combined": result["combined"],
              "integrated_v2_shadow": result["integrated_v2_shadow"],
              "data_coverage": result["data_coverage"],
              "contract": result["contract"],
              "result_sha256": result["result_sha256"],
          }
          print(json.dumps(compact, indent=2, sort_keys=True))

          assert result["reference_contract"] == "CRUDEOILM21SEP26FUT", result["reference_contract"]
          assert result["manifest"]["selected_click_count"] == 147, result["manifest"]
          assert all(result["daily"][day]["clicks"] == 49 for day in result["manifest"]["evaluation_days"]), result["daily"]
          assert result["combined"]["clicks"] == 147, result["combined"]
          assert result["contract"]["integrated_v2_shadow_only"] is True, result["contract"]
          assert result["contract"]["current_mind_rules_changed"] is False, result["contract"]
          assert result["contract"]["fixed_horizon_direction_scoring_used"] is False, result["contract"]
          assert result["contract"]["threshold_search_used"] is False, result["contract"]
          assert result["contract"]["parameter_optimization_used"] is False, result["contract"]
          assert result["contract"]["full_remaining_session_path_used"] is True, result["contract"]
          assert result["contract"]["regular_crude_used"] is False, result["contract"]
          assert result["contract"]["synthetic_option_prices_used"] is False, result["contract"]
          assert result["contract"]["missing_futures_oi_reconstructed"] is False, result["contract"]
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crude-oil-mini-sep-3day-15m-replay
          path: crude-oil-mini-sep-3day-15m-replay.json
          if-no-files-found: error
          retention-days: 30
