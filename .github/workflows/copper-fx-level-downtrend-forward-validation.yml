name: Copper FX Level Downtrend Forward Validation
on:
  push:
    branches: [main]
    paths:
      - "app/copper_fx_level_downtrend_forward_validation.py"
      - "app/main.py"
      - ".github/workflows/copper-fx-level-downtrend-forward-validation.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
    steps:
      - name: Run Copper FX level downtrend forward validation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            code=$(curl --silent --output result.json --write-out "%{http_code}" --max-time 120 -H 'Content-Type: application/json' -X POST "$API_BASE/v1/research/copper/fx-level-downtrend-forward-validation-v1" -d '{"days":3650,"sample_every_bars":3,"round_trip_cost_bps":4.0}' || true)
            if [ "$code" = "200" ]; then python -m json.tool result.json; exit 0; fi
            sleep 10
          done
          cat result.json || true; exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copper-fx-level-downtrend-forward-validation-v1
          path: result.json
