name: Crude Brain B Comparison

on:
  pull_request:
    paths:
      - "app/crude_research_brain.py"
      - "app/crude_research_brain_b.py"
      - "tests/test_crude_research_brain*.py"
      - ".github/workflows/crude-brain-b-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crude-brain-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment-002:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Test frozen Crude A/B logic
        run: |
          python -m unittest tests.test_crude_research_brain tests.test_crude_research_brain_b -v

      - name: Compare Brain A and Brain B on the same holdout
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python - <<'PY'
          import asyncio
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import psycopg

          from app.crude_research_brain import read_exact_crude_contract_from_store
          from app.crude_research_brain_b import compare_crude_brains_a_b

          IST=ZoneInfo("Asia/Kolkata")
          start=datetime(2026,8,17,9,0,tzinfo=IST)
          end=datetime(2026,9,1,23,30,tzinfo=IST)
          with psycopg.connect(os.environ["DATABASE_URL"],connect_timeout=10) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("""
                      SELECT trading_symbol, COUNT(*) AS n
                      FROM commodity_candles
                      WHERE provider='GROWW' AND symbol='CRUDEOIL' AND timeframe_minutes=5
                        AND candle_at >= %s AND candle_at <= %s
                      GROUP BY trading_symbol
                      ORDER BY n DESC, trading_symbol ASC
                      LIMIT 1
                  """,(start,end))
                  row=cursor.fetchone()
          assert row and row[0],"No exact Crude contract data available"
          contract,count=row
          candles=asyncio.run(read_exact_crude_contract_from_store(
              os.environ["DATABASE_URL"],contract,start,end
          ))
          result=compare_crude_brains_a_b(
              candles,
              trading_symbol=contract,
              sample_every_bars=3,
              round_trip_cost_bps=4.0,
          )
          result["contract_selection"]={
              "method":"MOST_COMPLETE_EXACT_CONTRACT_IN_FROZEN_WINDOW",
              "trading_symbol":contract,
              "stored_rows":count,
          }
          Path("crude-experiment-002.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          compact={
              "mode":result["mode"],
              "contract":contract,
              "coverage":result["coverage"],
              "split":result["split"],
              "train":{
                  "brain_a":{k:result["train"]["brain_a"].get(k) for k in ("signals","win_rate_pct","avg_net_return_pct","profit_factor")},
                  "brain_b":{k:result["train"]["brain_b"].get(k) for k in ("signals","win_rate_pct","avg_net_return_pct","profit_factor")},
              },
              "holdout":{
                  "brain_a":{k:result["holdout"]["brain_a"].get(k) for k in ("signals","win_rate_pct","avg_net_return_pct","profit_factor")},
                  "brain_b":{k:result["holdout"]["brain_b"].get(k) for k in ("signals","win_rate_pct","avg_net_return_pct","profit_factor")},
              },
              "gate":result["gate"],
              "next_gate":result["next_gate"],
          }
          print(json.dumps(compact,indent=2,sort_keys=True))
          assert result["news_enabled"] is False
          assert result["baseline_frozen_before_brain_b"] is True
          assert result["brain_b_config_selected_from_crude_outcomes"] is False
          PY

      - name: Upload A/B comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crude-experiment-002-no-news
          path: crude-experiment-002.json
          if-no-files-found: warn
          retention-days: 30
