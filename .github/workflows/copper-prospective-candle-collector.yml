name: Copper Prospective 5m Candle Collector

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes from 09:05 through 23:20 IST on weekdays.
    # UTC is IST-05:30, so :05/:20/:35/:50 IST maps to :35/:50/:05/:20 UTC.
    - cron: "35,50 3 * * 1-5"
    - cron: "5,20,35,50 4-17 * * 1-5"

permissions:
  contents: read

concurrency:
  group: copper-prospective-5m-candle-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API_BASE: https://alphapilot-api-pnio.onrender.com
      COLLECTOR_TOKEN: ${{ secrets.COMMODITY_COLLECTOR_TOKEN }}
    steps:
      - name: Confirm bounded Copper endpoint is deployed
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COLLECTOR_TOKEN"
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 20 "$API_BASE/openapi.json" -o openapi.json \
              && python - <<'PY'
          import json
          paths=(json.load(open("openapi.json")) or {}).get("paths") or {}
          required={
              "/v1/internal/copper/pit-candles/collect",
              "/v1/internal/copper/pit-candles/status",
              "/v1/internal/copper/direction-v2-shadow/evaluate",
              "/v1/internal/copper/direction-v2-shadow/prospective-status",
              "/v1/internal/copper/shared-commodity-brain/prospective-status",
          }
          raise SystemExit(0 if required.issubset(paths) else 1)
          PY
            then
              exit 0
            fi
            sleep 10
          done
          echo "Copper PIT/Direction V2/shared-brain endpoints were not ready" >&2
          exit 1

      - name: Capture bounded prospective Copper tape
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl --silent --show-error --max-time 180 -w "%{http_code}" \
            -H "X-Collector-Token: $COLLECTOR_TOKEN" \
            -H "Accept: application/json" \
            -X POST "$API_BASE/v1/internal/copper/pit-candles/collect" \
            -o copper-pit-result.json || echo 000)
          echo "HTTP=$CODE"
          [ "$CODE" = "200" ] || {
            cat copper-pit-result.json 2>/dev/null || true
            exit 1
          }
          python - <<'PY'
          import json
          d=json.load(open("copper-pit-result.json"))
          assert d.get("status") in {"COLLECTED","MARKET_CLOSED"}, d
          assert d.get("symbol")=="COPPER", d
          assert d.get("timeframe_minutes")==5, d
          assert d.get("research_only") is True, d
          assert d.get("production_rules_changed") is False, d
          assert d.get("live_execution_enabled") is False, d
          assert d.get("broker_order_placement_enabled") is False, d
          assert d.get("historical_backfill_used") is False, d
          if d.get("status")=="COLLECTED":
              assert d.get("first_seen_immutable") is True, d
              assert d.get("generic_all_commodity_collector_used") is False, d
              assert d.get("warmup_market_timestamps_retroactively_visible") is False, d
              assert str(d.get("contract") or "").startswith("COPPER"), d
          print(json.dumps({k:d.get(k) for k in (
              "status","symbol","contract","collected_at","fetch_start",
              "first_run_bounded_warmup","fetched","completed",
              "candidate_records","inserted_first_seen","latest_completed_at",
              "provenance_id"
          )}, indent=2, sort_keys=True))
          PY

      - name: Verify immutable store status
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            -H "X-Collector-Token: $COLLECTOR_TOKEN" \
            "$API_BASE/v1/internal/copper/pit-candles/status" \
            -o copper-pit-status.json
          python - <<'PY'
          import json
          d=json.load(open("copper-pit-status.json"))
          assert d.get("status")=="ACTIVE", d
          assert d.get("symbol")=="COPPER", d
          assert d.get("timeframe_minutes")==5, d
          assert d.get("first_seen_immutable") is True, d
          assert d.get("historical_backfill_used") is False, d
          assert d.get("live_execution_enabled") is False, d
          assert d.get("broker_order_placement_enabled") is False, d
          print(json.dumps(d, indent=2, sort_keys=True))
          PY

      - name: Capture prospective Direction V2 and shared Commodity Brain
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(python -c 'import json; print(json.load(open("copper-pit-result.json")).get("status",""))')
          if [ "$STATUS" = "MARKET_CLOSED" ]; then
            echo '{"status":"SKIPPED_MARKET_CLOSED"}' > copper-direction-v2-result.json
            exit 0
          fi
          CODE=$(curl --silent --show-error --max-time 90 -w "%{http_code}" \
            -H "X-Collector-Token: $COLLECTOR_TOKEN" \
            -H "Accept: application/json" \
            -X POST "$API_BASE/v1/internal/copper/direction-v2-shadow/evaluate" \
            -o copper-direction-v2-result.json || echo 000)
          echo "HTTP=$CODE"
          [ "$CODE" = "200" ] || {
            cat copper-direction-v2-result.json 2>/dev/null || true
            exit 1
          }
          python - <<'PY'
          import json
          d=json.load(open("copper-direction-v2-result.json"))
          p=d.get("prospective_persistence") or {}
          contract=d.get("integration_contract") or {}
          families=d.get("families") or {}
          option=families.get("OPTION_PARTICIPATION") or {}
          option_detail=option.get("detail") or {}
          expected_contract="COPPER_DIRECTION_BRAIN_V2_SHADOW_V2"
          expected_option_rule="COPPER_OPTION_PARTICIPATION_V1"

          assert d.get("mode")=="COPPER_DIRECTION_BRAIN_V2_SHADOW", d
          assert d.get("research_only") is True, d
          assert d.get("shadow_only") is True, d
          assert d.get("direction") in {"BULLISH","BEARISH","UNKNOWN"}, d
          assert d.get("decision_effect")=="NONE", d
          assert d.get("sealed_current_mind_effect")=="NONE", d
          assert d.get("production_rules_changed") is False, d
          assert d.get("live_execution_enabled") is False, d
          assert d.get("broker_order_placement_enabled") is False, d
          assert d.get("capital_committed")==0, d

          assert contract.get("version")==expected_contract, contract
          assert contract.get("option_participation_rule_version")==expected_option_rule, contract
          assert contract.get("minimum_independent_confirmations")==2, contract
          assert contract.get("raw_option_oi_directional_vote_allowed") is False, contract
          assert contract.get("option_participation_oi_flat_or_decrease_vote_allowed") is False, contract
          assert contract.get("option_participation_underlying_direction_vote_allowed") is False, contract
          assert contract.get("promotion_allowed") is False, contract

          assert option.get("family")=="OPTION_PARTICIPATION", option
          assert option.get("causal_origin")=="OPTION_MARKET_POSITIONING", option
          assert option_detail.get("rule_version")==expected_option_rule, option_detail
          if option.get("counts_for_direction"):
              assert option.get("stance") in {"BULLISH","BEARISH"}, option
              if option.get("stance")=="BULLISH":
                  assert int(option_detail.get("bullish_ce_evidence") or 0)>=1, option_detail
                  assert int(option_detail.get("bullish_pe_evidence") or 0)>=1, option_detail
                  assert int(option_detail.get("bearish_ce_evidence") or 0)==0, option_detail
                  assert int(option_detail.get("bearish_pe_evidence") or 0)==0, option_detail
              else:
                  assert int(option_detail.get("bearish_ce_evidence") or 0)>=1, option_detail
                  assert int(option_detail.get("bearish_pe_evidence") or 0)>=1, option_detail
                  assert int(option_detail.get("bullish_ce_evidence") or 0)==0, option_detail
                  assert int(option_detail.get("bullish_pe_evidence") or 0)==0, option_detail

          assert p.get("contract_version")==expected_contract, p
          assert p.get("first_seen_immutable") is True, p
          assert p.get("outcome_fields_stored") is False, p
          assert p.get("historical_as_of_allowed") is False, p
          assert p.get("evaluation_id"), p
          assert p.get("record_hash"), p
          assert p.get("board_as_of"), p
          assert p.get("evaluated_at"), p

          shared=d.get("shared_commodity_brain_prospective_v1") or {}
          sp=shared.get("prospective_persistence") or {}
          provenance=shared.get("input_provenance") or {}
          shared_contract=shared.get("integration_contract") or {}
          memory=(shared.get("families") or {}).get("EXPERIENCE_MEMORY") or {}
          assert shared.get("status")=="EVALUATED", shared
          assert shared.get("mode")=="COPPER_COMMODITY_BRAIN_SHARED_SHADOW_V1", shared
          assert shared.get("prospective_stream_id")=="COPPER_COMMODITY_BRAIN_SHARED_PROSPECTIVE_V1", shared
          assert shared.get("evaluation_class")=="PROSPECTIVE_SHADOW", shared
          assert shared.get("prospective") is True, shared
          assert shared.get("research_only") is True, shared
          assert shared.get("shadow_only") is True, shared
          assert shared.get("same_pit_board_as_direction_v2") is True, shared
          assert shared.get("sealed_current_mind_effect")=="NONE", shared
          assert shared.get("decision_effect")=="NONE", shared
          assert shared.get("live_execution_enabled") is False, shared
          assert shared.get("broker_order_placement_enabled") is False, shared
          assert int(shared.get("capital_committed") or 0)==0, shared
          assert shared.get("promotion_eligible") is False, shared
          assert shared.get("outcome_blind_at_decision_time") is True, shared
          assert shared.get("forward_outcome_data_read") is False, shared
          assert shared.get("pnl_read") is False, shared
          assert provenance.get("status")=="VALID", provenance
          assert provenance.get("historical_backfill_used") is False, provenance
          if provenance.get("market_status")=="AVAILABLE":
              assert provenance.get("market_first_seen_immutable") is True, provenance
          if provenance.get("option_status")=="AVAILABLE":
              assert provenance.get("option_first_seen_immutable") is True, provenance
          assert memory.get("counts_for_direction") is False, memory
          assert memory.get("role")=="MEMORY", memory
          assert shared_contract.get("minimum_independent_confirmations")==2, shared_contract
          assert shared_contract.get("experience_memory_can_satisfy_confirmation_gate") is False, shared_contract
          assert shared_contract.get("historical_reconstruction_allowed") is False, shared_contract
          assert shared_contract.get("mutable_generic_fallback_allowed") is False, shared_contract
          assert shared_contract.get("sealed_copper_current_mind_effect")=="NONE", shared_contract
          assert shared_contract.get("direction_v2_history_effect")=="NONE", shared_contract
          assert sp.get("model_id")=="COPPER_COMMODITY_BRAIN_SHARED_PROSPECTIVE_V1", sp
          assert sp.get("contract_version")=="COPPER_COMMODITY_BRAIN_SHARED_SHADOW_V1", sp
          assert sp.get("first_seen_immutable") is True, sp
          assert sp.get("outcome_fields_stored") is False, sp
          assert sp.get("historical_as_of_allowed") is False, sp
          assert sp.get("prospective_memory_eligible") is False, sp
          assert sp.get("evaluation_id"), sp
          assert sp.get("record_hash"), sp
          assert sp.get("board_as_of")==p.get("board_as_of"), (sp,p)
          assert sp.get("evaluated_at")==p.get("evaluated_at"), (sp,p)

          print(json.dumps({
              "direction_v2":{
                  "contract_version":contract.get("version"),
                  "direction":d.get("direction"),
                  "confidence":d.get("direction_confidence"),
                  "thesis_state":d.get("thesis_state"),
              },
              "shared_commodity_brain":{
                  "stream_id":shared.get("prospective_stream_id"),
                  "contract_version":sp.get("contract_version"),
                  "direction":shared.get("direction"),
                  "confidence":shared.get("direction_confidence"),
                  "thesis_state":shared.get("thesis_state"),
                  "supporting_families":shared.get("supporting_families"),
                  "opposing_families":shared.get("opposing_families"),
                  "market_contract":provenance.get("market_trading_symbol"),
              },
              "same_board_as_of":sp.get("board_as_of"),
          }, indent=2, sort_keys=True))
          PY

      - name: Verify outcome-blind Direction V2 coverage
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(python -c 'import json; print(json.load(open("copper-pit-result.json")).get("status",""))')
          if [ "$STATUS" = "MARKET_CLOSED" ]; then
            echo '{"status":"SKIPPED_MARKET_CLOSED"}' > copper-direction-v2-status.json
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "X-Collector-Token: $COLLECTOR_TOKEN" \
            "$API_BASE/v1/internal/copper/direction-v2-shadow/prospective-status" \
            -o copper-direction-v2-status.json
          python - <<'PY'
          import json
          d=json.load(open("copper-direction-v2-status.json"))
          captured=json.load(open("copper-direction-v2-result.json"))
          p=captured.get("prospective_persistence") or {}
          expected_contract=p.get("contract_version")
          versions=d.get("by_contract_version") or {}
          assert expected_contract=="COPPER_DIRECTION_BRAIN_V2_SHADOW_V2", p
          assert d.get("status")=="ACTIVE", d
          assert d.get("first_seen_immutable") is True, d
          assert d.get("outcome_data_read") is False, d
          assert d.get("performance_claim") is None, d
          assert d.get("production_rules_changed") is False, d
          assert d.get("live_execution_enabled") is False, d
          assert d.get("broker_order_placement_enabled") is False, d
          assert int(d.get("evaluations") or 0)>=1, d
          assert int(versions.get(expected_contract) or 0)>=1, d
          print(json.dumps(d, indent=2, sort_keys=True))
          PY

      - name: Verify outcome-blind shared Commodity Brain coverage
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(python -c 'import json; print(json.load(open("copper-pit-result.json")).get("status",""))')
          if [ "$STATUS" = "MARKET_CLOSED" ]; then
            echo '{"status":"SKIPPED_MARKET_CLOSED"}' > copper-shared-brain-status.json
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "X-Collector-Token: $COLLECTOR_TOKEN" \
            "$API_BASE/v1/internal/copper/shared-commodity-brain/prospective-status" \
            -o copper-shared-brain-status.json
          python - <<'PY'
          import json
          d=json.load(open("copper-shared-brain-status.json"))
          assert d.get("status")=="ACTIVE", d
          assert d.get("model_id")=="COPPER_COMMODITY_BRAIN_SHARED_PROSPECTIVE_V1", d
          assert d.get("contract_version")=="COPPER_COMMODITY_BRAIN_SHARED_SHADOW_V1", d
          assert d.get("first_seen_immutable") is True, d
          assert d.get("historical_backfill_used") is False, d
          assert d.get("historical_as_of_allowed") is False, d
          assert d.get("outcome_data_read") is False, d
          assert d.get("performance_claim") is None, d
          assert d.get("sealed_current_mind_effect")=="NONE", d
          assert d.get("direction_v2_history_effect")=="NONE", d
          assert d.get("production_rules_changed") is False, d
          assert d.get("live_execution_enabled") is False, d
          assert d.get("broker_order_placement_enabled") is False, d
          assert int(d.get("capital_committed") or 0)==0, d
          assert d.get("promotion_eligible") is False, d
          assert int(d.get("evaluations") or 0)>=1, d
          print(json.dumps(d, indent=2, sort_keys=True))
          PY

      - name: Upload Copper PIT audit artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copper-prospective-5m-${{ github.run_id }}
          path: |
            copper-pit-result.json
            copper-pit-status.json
            copper-direction-v2-result.json
            copper-direction-v2-status.json
            copper-shared-brain-status.json
          if-no-files-found: warn
          retention-days: 30
